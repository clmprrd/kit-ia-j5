<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comportements en salle</title>
<style>
  :root{
    --magenta:#E91FCB;
    --noir:#1A1A1A;
    --blanc:#FFFFFF;
    --gris:#4A4A4A;
    --rose:#FCE4F7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--blanc);
    color:var(--noir);
    -webkit-font-smoothing:antialiased;
  }

  /* ===== BARRE HAUTE ===== */
  .bar{
    position:fixed;top:0;left:0;right:0;height:64px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;background:var(--blanc);
    border-bottom:3px solid var(--magenta);z-index:50;
  }
  .bar .titre{font-size:17px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;color:var(--gris)}
  .bar .droite{display:flex;align-items:center;gap:18px}
  .compteur{font-size:26px;font-weight:bold;color:var(--magenta);white-space:nowrap}
  .btn{
    font-family:Arial, Helvetica, sans-serif;font-size:15px;font-weight:bold;
    padding:10px 18px;border:3px solid var(--noir);background:var(--blanc);color:var(--noir);
    cursor:pointer;border-radius:0;
  }
  .btn:hover{background:var(--rose)}
  .btn.actif{background:var(--magenta);border-color:var(--magenta);color:var(--blanc)}
  .progress{position:fixed;top:61px;left:0;height:6px;background:var(--magenta);z-index:51;transition:width .2s}

  /* ===== SCENE ===== */
  .scene{
    position:fixed;top:64px;left:0;right:0;bottom:88px;
    overflow-y:auto;
  }
  .ecran{
    min-height:100%;
    display:flex;flex-direction:column;justify-content:center;
    padding:44px 6vw 44px 6vw;
  }
  .ecran.pale{background:var(--rose)}
  .ecran.dark{background:var(--noir);color:var(--blanc)}
  .ecran.dark .kicker{color:var(--magenta)}
  .ecran.dark .sous{color:#E8E8E8}
  .ecran.dark .bloc{background:#2A2A2A;border-color:var(--magenta)}
  .ecran.dark .petit{color:#BBBBBB}

  .kicker{
    font-size:clamp(18px,1.9vw,30px);font-weight:bold;letter-spacing:3px;
    text-transform:uppercase;color:var(--magenta);margin-bottom:22px;
  }
  .grand{
    font-size:clamp(30px,4.4vw,66px);line-height:1.12;font-weight:bold;
    letter-spacing:-.5px;max-width:28ch;
  }
  .grand.long{font-size:clamp(26px,3.2vw,48px);max-width:26ch}
  .citation{
    font-size:clamp(30px,4.6vw,68px);line-height:1.14;font-weight:bold;
    max-width:26ch;color:var(--noir);
  }
  .sous{
    font-size:clamp(19px,1.9vw,30px);line-height:1.5;color:var(--gris);
    margin-top:26px;max-width:64ch;
  }
  .consigne{
    margin-top:34px;font-size:clamp(18px,2vw,31px);font-weight:bold;
    color:var(--magenta);text-transform:uppercase;letter-spacing:1.5px;
  }
  .petit{margin-top:26px;font-size:clamp(13px,1vw,16px);color:var(--gris);line-height:1.5;max-width:60ch}

  /* ===== REVELATION ===== */
  .reveal{display:none;margin-top:34px;border-top:5px solid var(--magenta);padding-top:28px}
  .reveal.on{display:block}
  .reveal p{font-size:clamp(17px,1.7vw,26px);line-height:1.5;max-width:52ch;margin-bottom:16px}
  .reveal p strong{color:var(--magenta)}
  .ecran.dark .reveal p{color:var(--blanc)}

  .badge{
    display:inline-block;font-size:clamp(18px,2vw,30px);font-weight:bold;
    padding:8px 22px;background:var(--magenta);color:var(--blanc);
    letter-spacing:3px;margin-bottom:20px;
  }
  .badge.valeur{background:var(--noir)}

  .duo{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
  .col{flex:1 1 320px;padding:24px;border:4px solid var(--magenta);background:var(--blanc)}
  .col.contre{background:var(--noir);color:var(--blanc);border-color:var(--noir)}
  .col h4{font-size:clamp(17px,1.7vw,28px);text-transform:uppercase;letter-spacing:2px;color:var(--magenta);margin-bottom:14px}
  .col.contre h4{color:var(--blanc)}
  .col p{font-size:clamp(17px,1.6vw,25px);line-height:1.45;margin:0}

  .bloc{background:var(--rose);border-left:10px solid var(--magenta);padding:26px 28px;margin-top:8px}
  .bloc p{margin:0}

  .liste{list-style:none;margin-top:10px}
  .liste li{
    font-size:clamp(17px,1.8vw,28px);line-height:1.4;padding:16px 0 16px 30px;
    border-bottom:2px solid var(--rose);position:relative;
  }
  .liste li:before{content:"";position:absolute;left:0;top:26px;width:14px;height:14px;background:var(--magenta)}
  .liste li b{color:var(--magenta)}
  .ecran.dark .liste li{border-bottom-color:#3A3A3A}

  .phrase{
    font-size:clamp(20px,2.2vw,34px);line-height:1.4;font-weight:bold;
    font-style:normal;max-width:56ch;
  }
  .copier{margin-top:18px}
  .copier .btn{border-color:var(--magenta);color:var(--magenta)}
  .copier .btn:hover{background:var(--magenta);color:var(--blanc)}
  .copie-ok{margin-left:12px;font-size:15px;font-weight:bold;color:var(--magenta)}

  /* ===== BARRE BASSE ===== */
  .nav{
    position:fixed;bottom:0;left:0;right:0;height:88px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;background:var(--blanc);border-top:3px solid var(--noir);z-index:50;
  }
  .fleche{
    font-family:Arial, Helvetica, sans-serif;font-size:30px;font-weight:bold;
    width:74px;height:56px;border:3px solid var(--noir);background:var(--blanc);
    color:var(--noir);cursor:pointer;line-height:1;
  }
  .fleche:hover{background:var(--rose)}
  .fleche:disabled{opacity:.25;cursor:default}
  .btn-methode{
    font-family:Arial, Helvetica, sans-serif;font-size:clamp(18px,1.9vw,30px);font-weight:bold;
    padding:16px 34px;background:var(--magenta);color:var(--blanc);border:none;cursor:pointer;
    letter-spacing:1px;
  }
  .btn-methode:hover{background:var(--noir)}
  .btn-methode.vide{visibility:hidden}

  /* ===== MODE LISTE ===== */
  .liste-mode{display:none;padding:100px 6vw 80px 6vw}
  .liste-mode.on{display:block}
  body.mode-liste .scene,body.mode-liste .nav,body.mode-liste .progress{display:none}
  .liste-mode .ecran{
    min-height:0;display:block;padding:40px 34px;margin-bottom:22px;
    border:3px solid var(--noir);
  }
  .liste-mode .reveal{display:block}
  .liste-mode .num{font-size:14px;font-weight:bold;color:var(--gris);letter-spacing:2px;margin-bottom:10px}
  .liste-mode .grand,.liste-mode .citation{font-size:clamp(24px,2.6vw,38px);max-width:100%}
  .liste-mode .sous,.liste-mode .reveal p{max-width:100%}
  .liste-mode h1.doc{font-size:38px;margin-bottom:8px;color:var(--magenta)}
  .liste-mode p.doc{font-size:18px;color:var(--gris);margin-bottom:34px}

  @media print{
    .bar,.nav,.progress{display:none}
    .scene{position:static;display:block}
    .ecran{page-break-after:always;min-height:auto}
    .reveal{display:block}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="titre">Comportements en salle</div>
  <div class="droite">
    <div class="compteur" id="compteur">1 sur 30</div>
    <button class="btn" id="btn-liste">Mode liste</button>
  </div>
</div>
<div class="progress" id="progress" style="width:0"></div>

<div class="scene" id="scene"></div>

<div class="nav">
  <button class="fleche" id="prec">&#8592;</button>
  <button class="btn-methode" id="btn-reveal">Ce que dit la méthode</button>
  <button class="fleche" id="suiv">&#8594;</button>
</div>

<div class="liste-mode" id="liste-mode"></div>

<script>
var SCREENS = [];

function obj(n, texte, nature, reponse){
  return {
    v: "",
    kicker: "Objection " + n + " sur 10",
    citation: "« " + texte + " »",
    consigne: "FAIT ou VALEUR ? Puis quelle réponse ?",
    reveal: '<span class="badge' + (nature === "VALEUR" ? " valeur" : "") + '">' + nature + '</span><p>' + reponse + '</p>'
  };
}

function profil(n, nom, manif, cause, marche, aggrave){
  return {
    v: "",
    kicker: "Profil " + n + " sur 5",
    grand: "Le profil : " + nom,
    sous: manif,
    consigne: "Qu'est-ce que vous faites, vous ?",
    reveal:
      '<p><strong>Ce qui le produit :</strong> ' + cause + '</p>' +
      '<div class="duo">' +
        '<div class="col"><h4>Ce qui marche</h4><p>' + marche + '</p></div>' +
        '<div class="col contre"><h4>Ce qui aggrave</h4><p>' + aggrave + '</p></div>' +
      '</div>',
    petit: "Source : guides de formation de formateurs, Cegos et formationdeformateurs.fr. Ce sont des repères de terrain, pas une typologie académique validée par la recherche."
  };
}

function situ(n, titre, sionnefaitrien, geste){
  return {
    v: "",
    kicker: "Situation " + n + " sur 8",
    grand: titre,
    consigne: "Qu'est-ce qui se passe si vous ne faites rien ?",
    reveal:
      '<p><strong>Si on ne fait rien :</strong> ' + sionnefaitrien + '</p>' +
      '<p><strong>Le geste qui répare :</strong> ' + geste + '</p>'
  };
}

/* ---------- 1. Ouverture ---------- */
SCREENS.push({
  v: "",
  kicker: "La règle à retenir",
  grand: "Ne jamais engager la discussion en premier avec l'opposant.",
  sous: "Faites parler le promoteur du groupe en premier. C'est le groupe qui convainc, ce n'est pas le formateur qui convainc seul contre un opposant, face à toute la salle.",
  consigne: "Pourquoi est-ce que ça marche, à votre avis ?",
  reveal:
    '<p>Ce principe s\'appuie sur le concept de <strong>leader d\'opinion</strong>, formalisé par Paul Lazarsfeld et Elihu Katz, école de Columbia : dans un groupe, l\'information et la conviction circulent moins d\'un émetteur unique vers chaque individu que par relais, via quelques personnes influentes que les autres écoutent. Convaincre le relais convainc le groupe plus sûrement que convaincre chaque personne une par une.</p>' +
    '<p>Ça rejoint la <strong>diffusion de l\'innovation</strong> d\'Everett Rogers : une idée nouvelle se propage par cercles successifs, des innovateurs et adopteurs précoces vers la majorité, et ce sont ces premiers cercles qui font basculer les suivants. Le promoteur dans votre salle est souvent un adopteur précoce.</p>'
});

/* ---------- 2 et 3. La distinction la plus importante ---------- */
SCREENS.push({
  v: "pale",
  kicker: "La distinction la plus importante, 1 sur 2",
  grand: "Objection de FAIT",
  sous: "« ça ne marche pas », « ça hallucine », « ça va me faire perdre mon poste ». La personne conteste une performance ou une conséquence mesurable.",
  consigne: "Qu'est-ce qu'on oppose à une objection de fait ?",
  reveal:
    '<p><strong>Se traite par la preuve :</strong> démonstration en direct, cas d\'usage sur le poste réel de la personne, chiffres vérifiables.</p>' +
    '<p>La preuve fonctionne parce que le désaccord porte sur des faits.</p>'
});

SCREENS.push({
  v: "dark",
  kicker: "La distinction la plus importante, 2 sur 2",
  grand: "Objection de VALEUR",
  sous: "« l'IA est néfaste par principe », argument environnemental, argument politique. La personne ne conteste pas l'efficacité, elle conteste la légitimité ou la désirabilité même de l'outil.",
  consigne: "Et là, qu'est-ce qui change ?",
  reveal:
    '<p><strong>Ne se traite pas par la preuve d\'efficacité :</strong> prouver que l\'outil marche mieux ne répond à rien puisque l\'efficacité n\'est pas ce qui est contesté.</p>' +
    '<p>La <strong>Moral Foundations Theory</strong> de Jonathan Haidt et Jesse Graham établit qu\'une opposition de nature morale résiste à l\'argumentation factuelle : on ne fait pas céder un jugement moral avec des chiffres, parce que le jugement moral ne s\'est pas construit avec des chiffres.</p>' +
    '<p>Face à une objection de valeur, la conduite juste est de reconnaître le désaccord explicitement, donner les vrais chiffres sans les esquiver ni les minimiser, et ne pas chercher à convertir la personne. <strong>On respecte la position, on informe, on n\'insiste pas.</strong></p>'
});

/* ---------- 4 à 13. Dix objections ---------- */
SCREENS.push(obj(1, "Ça invente des choses, je ne peux pas m'y fier", "FAIT",
  "Démonstration en direct d'une hallucination repérée, puis de la méthode de vérification systématique (source, recoupement). <strong>La preuve, pas la promesse.</strong>"));
SCREENS.push(obj(2, "Ça va supprimer mon poste", "FAIT",
  "Cas d'usage précis sur le métier de la personne : ce qui est automatisable face à ce qui reste humain, avec des exemples concrets tirés de son quotidien."));
SCREENS.push(obj(3, "L'IA consomme trop d'énergie, c'est une aberration écologique", "VALEUR",
  "Reconnaître le désaccord, donner les chiffres vérifiés, ne pas chercher à convaincre que c'est acceptable."));
SCREENS.push(obj(4, "Je ne veux pas être remplacé par une machine, c'est une question de principe", "VALEUR",
  "Reconnaître la position sans la réfuter, ne pas argumenter sur l'efficacité qui n'est pas le sujet ici."));
SCREENS.push(obj(5, "Ça a déjà été essayé chez nous, ça n'a pas marché", "FAIT",
  "Demander ce qui a été tenté précisément, souvent l'échec vient d'un mauvais prompt ou d'un mauvais cas d'usage, le montrer sur un exemple corrigé."));
SCREENS.push(obj(6, "C'est une mode, ça va passer", "FAIT",
  "Chiffres d'adoption réels et cas d'usage déjà en production dans des entreprises comparables au secteur de la personne."));
SCREENS.push(obj(7, "Ça va déshumaniser la relation client", "VALEUR",
  "Reconnaître l'inquiétude, ne pas la balayer par des statistiques de satisfaction, montrer où l'humain reste central sans prétendre que le sujet est clos."));
SCREENS.push(obj(8, "Je n'ai pas le temps d'apprendre un nouvel outil", "FAIT",
  "Chiffrer le temps gagné sur une tâche concrète de son poste, en minutes réelles, pas en promesse générale."));
SCREENS.push(obj(9, "Les grandes entreprises technologiques accumulent trop de pouvoir avec l'IA", "VALEUR",
  "Reconnaître que c'est un enjeu politique légitime, ne pas y répondre par des arguments de performance produit."));
SCREENS.push(obj(10, "Mes données, mes documents internes, où vont-ils vraiment ?", "FAIT",
  "Réponse factuelle et vérifiable sur le traitement des données, les paramètres de confidentialité, sans minimiser un risque réel."));

/* ---------- 14. Chiffres environnementaux ---------- */
SCREENS.push({
  v: "",
  kicker: "Les chiffres environnementaux",
  grand: "Trois ordres de grandeur, à donner tels quels",
  consigne: "Quels chiffres avez-vous en tête ?",
  reveal:
    '<ul class="liste">' +
      '<li><b>6 à 10 fois</b> plus d\'électricité pour une requête d\'IA générative qu\'une recherche web classique</li>' +
      '<li><b>460 à 1000 TWh et plus</b>, consommation mondiale des data centers, de 2022 à une projection 2026</li>' +
      '<li><b>environ 0,5 litre d\'eau</b> mobilisée pour 10 à 50 requêtes</li>' +
    '</ul>' +
    '<div class="bloc" style="margin-top:26px"><p style="font-size:clamp(17px,1.6vw,25px);line-height:1.45"><strong>Mention obligatoire :</strong> ces trois chiffres sont à donner tels quels, comme ordres de grandeur, jamais comme argument pour minimiser l\'impact ni pour le dramatiser. Ce sont des ordres de grandeur, pas des mesures consensuelles.</p></div>'
});

/* ---------- 15 à 19. Cinq profils ---------- */
SCREENS.push(profil(1, "le bavard",
  "Monopolise la parole, digresse.",
  "un besoin de reconnaissance, une anxiété comblée par la parole.",
  "Reformuler son propos puis relancer le groupe, « pour aller plus loin, qu'en pensent les autres ? »",
  "Le couper sèchement en public : il double la prise de parole suivante."));
SCREENS.push(profil(2, "le contradicteur",
  "Objecte systématiquement, teste le formateur.",
  "une position hiérarchique menacée, un besoin de contrôle.",
  "Laisser le groupe répondre avant le formateur.",
  "Vouloir le convaincre frontalement : la contradiction devient un duel."));
SCREENS.push(profil(3, "l'expert auto-proclamé",
  "Prend la place du formateur, cas particuliers hors sujet.",
  "une compétence réelle mais non reconnue, ou la peur de paraître dépassé.",
  "Nommer l'expertise à voix haute puis la mettre au service du groupe.",
  "L'ignorer ou minimiser : il cherche alors des alliés contre le formateur."));
SCREENS.push(profil(4, "le discret",
  "Silence, aucune contribution.",
  "de la timidité, un désaccord non formulé, un désengagement réel.",
  "Solliciter en aparté, questions fermées d'abord.",
  "Le forcer en public : humiliation puis retrait définitif."));
SCREENS.push(profil(5, "le démotivé",
  "Présence physique sans engagement.",
  "une formation subie, décidée par la hiérarchie sans lui.",
  "Faire nommer ce qui a manqué, reconnecter à un usage concret pour lui.",
  "Faire comme si de rien n'était : le silence collectif valide son désengagement."));

/* ---------- 20 à 27. Huit situations ---------- */
SCREENS.push(situ(1, "Un participant sort son téléphone",
  "signal de décrochage qui se propage visuellement.",
  "réintégrer par une tâche courte et nominative, jamais une remarque publique."));
SCREENS.push(situ(2, "Un participant conteste un chiffre",
  "le doute s'installe pour tout le reste de la session.",
  "reconnaître l'incertitude, proposer de vérifier ensemble en direct."));
SCREENS.push(situ(3, "« La direction a déjà décidé »",
  "le groupe se range derrière ce cadrage fataliste.",
  "séparer la décision, hors de portée, de la pratique, dans la salle, aujourd'hui."));
SCREENS.push(situ(4, "Il a testé et il a été déçu",
  "sa déception devient la norme du groupe.",
  "faire décrire précisément le cas raté, c'est souvent un problème de prompt ou de cas d'usage, pas d'outil."));
SCREENS.push(situ(5, "Il en sait plus que le formateur",
  "perte de crédibilité si on l'ignore ou si on bluffe.",
  "le nommer coformateur sur ce point, à voix haute."));
SCREENS.push(situ(6, "Le groupe entier se tait",
  "le silence est lu comme un accord de façade.",
  "passer en sous-groupes de deux ou trois, le silence collectif ne résiste pas au binôme."));
SCREENS.push(situ(7, "Deux participants se contredisent",
  "le groupe se polarise, un camp se forme.",
  "faire reformuler à chacun ce que dit l'autre avant de trancher, jamais le formateur en arbitre."));
SCREENS.push(situ(8, "Un manager présent inhibe son équipe",
  "l'équipe s'autocensure toute la session.",
  "proposer une séquence sans hiérarchie, ou recueillir en écrit anonyme."));

/* ---------- 28. Six chiffres sur la résistance ---------- */
SCREENS.push({
  v: "",
  kicker: "Six chiffres sur la résistance à l'IA, 2026",
  grand: "La méfiance est majoritaire",
  consigne: "À votre avis, combien de salariés se disent méfiants ?",
  reveal:
    '<ul class="liste">' +
      '<li><b>44 pourcent</b> des jeunes salariés déclarent pouvoir saboter des initiatives IA par peur d\'être remplacés (Writer et Workplace Intelligence, avril 2026)</li>' +
      '<li><b>61 pourcent</b> des salariés se disent méfiants envers l\'IA (Harvard Business Review)</li>' +
      '<li><b>28 pourcent</b> des actifs se sentent dépassés, surtout les 50-65 ans et les professions intermédiaires (Ipsos, juin 2025)</li>' +
      '<li><b>88 pourcent</b> des organisations ont déployé de l\'IA, <b>6 pourcent</b> seulement en tirent un impact mesurable (études 2026 citées par Adequancy)</li>' +
      '<li><b>3,8 pourcent</b> de l\'emploi français est fragilisé par l\'IA générative (Coface, avril 2026)</li>' +
      '<li><b>moins de 5 pourcent</b> des entreprises françaises ont négocié un accord IA (IRES, FO, CGT, 2026)</li>' +
    '</ul>' +
    '<div class="bloc" style="margin-top:28px">' +
      '<p class="phrase" id="phrase-1">Votre méfiance n\'est pas irrationnelle, elle est même partagée par six salariés sur dix. La question n\'est pas de l\'éteindre, c\'est de savoir ce qu\'on en fait aujourd\'hui.</p>' +
      '<div class="copier"><button class="btn" data-copy="phrase-1">Copier la phrase</button><span class="copie-ok" id="ok-phrase-1"></span></div>' +
    '</div>'
});

/* ---------- 29. Six méthodes nommées ---------- */
SCREENS.push({
  v: "dark",
  kicker: "Six méthodes nommées",
  grand: "Ce sur quoi tout ça s'appuie",
  consigne: "Lesquelles connaissez-vous déjà ?",
  reveal:
    '<ul class="liste">' +
      '<li><b>Diffusion de l\'innovation</b>, Everett Rogers, l\'adoption suit une courbe. Geste : identifier les deux ou trois précoces du groupe dès le début et s\'appuyer sur eux publiquement.</li>' +
      '<li><b>Leader d\'opinion</b>, Lazarsfeld et Katz, l\'influence passe par un relais. Geste : repérer qui le groupe regarde quand il hésite, et convaincre cette personne en premier.</li>' +
      '<li><b>Entretien motivationnel</b>, Miller et Rollnick, c\'est la personne qui doit nommer sa propre ambivalence. Geste : « qu\'est-ce qui vous ferait dire oui, et qu\'est-ce qui vous retient ? »</li>' +
      '<li><b>Autodétermination</b>, Deci et Ryan, autonomie, compétence, appartenance. Geste : toujours laisser un choix réel dans l\'exercice.</li>' +
      '<li><b>Courbe du changement</b>, Kübler-Ross adaptée à la conduite du changement, le refus et la colère sont des étapes normales. Geste : nommer l\'étape sans la juger, « ce que vous dites, c\'est typique du moment où on n\'y croit pas encore, et c\'est normal ».</li>' +
      '<li><b>Dégel, changement, regel</b>, Kurt Lewin, aucun changement ne tient sans déstabiliser d\'abord. Geste : commencer par une expérience qui bouscule une certitude, avant tout contenu.</li>' +
    '</ul>'
});

/* ---------- 30. Clôture ---------- */
SCREENS.push({
  v: "",
  kicker: "Pour finir",
  grand: "Ce qui n'est pas solidement sourcé",
  sous: "Deux points restent des hypothèses de terrain, pas des faits établis.",
  consigne: "À dire tel quel si la question tombe en salle",
  reveal:
    '<ul class="liste">' +
      '<li>Les <b>trois chiffres environnementaux</b> sont des ordres de grandeur et non des mesures consensuelles.</li>' +
      '<li>L\'idée que <b>l\'expert auto-proclamé agit par peur de paraître dépassé</b> n\'a aucune donnée chiffrée derrière, seulement une observation répétée sur le terrain.</li>' +
    '</ul>' +
    '<div class="bloc" style="margin-top:28px">' +
      '<p class="phrase" id="phrase-2">On va faire un tour en binôme deux minutes, pas besoin de lever la main pour parler.</p>' +
      '<div class="copier"><button class="btn" data-copy="phrase-2">Copier la phrase</button><span class="copie-ok" id="ok-phrase-2"></span></div>' +
    '</div>'
});

/* ================= RENDU ================= */
var TOTAL = SCREENS.length;
var index = 0;
var scene = document.getElementById("scene");
var compteur = document.getElementById("compteur");
var progress = document.getElementById("progress");
var btnReveal = document.getElementById("btn-reveal");

function corps(s, avecNum, num){
  var h = "";
  if (avecNum) h += '<div class="num">ÉCRAN ' + num + " SUR " + TOTAL + "</div>";
  if (s.kicker) h += '<div class="kicker">' + s.kicker + "</div>";
  if (s.citation) h += '<div class="citation">' + s.citation + "</div>";
  if (s.grand) h += '<div class="grand' + (s.grand.length > 42 ? " long" : "") + '">' + s.grand + "</div>";
  if (s.sous) h += '<div class="sous">' + s.sous + "</div>";
  if (s.consigne) h += '<div class="consigne">' + s.consigne + "</div>";
  h += '<div class="reveal">' + s.reveal + "</div>";
  if (s.petit) h += '<div class="petit">' + s.petit + "</div>";
  return h;
}

function afficher(){
  var s = SCREENS[index];
  var d = document.createElement("div");
  d.className = "ecran" + (s.v ? " " + s.v : "");
  d.innerHTML = corps(s, false, 0);
  scene.innerHTML = "";
  scene.appendChild(d);
  scene.scrollTop = 0;
  compteur.textContent = (index + 1) + " sur " + TOTAL;
  progress.style.width = ((index + 1) / TOTAL * 100) + "%";
  document.getElementById("prec").disabled = (index === 0);
  document.getElementById("suiv").disabled = (index === TOTAL - 1);
  btnReveal.classList.remove("vide");
  btnReveal.textContent = "Ce que dit la méthode";
}

function reveler(){
  var r = scene.querySelector(".reveal");
  if (!r) return;
  r.classList.add("on");
  btnReveal.classList.add("vide");
}

function aller(n){
  if (n < 0 || n >= TOTAL) return;
  index = n;
  afficher();
}

document.getElementById("prec").onclick = function(){ aller(index - 1); };
document.getElementById("suiv").onclick = function(){ aller(index + 1); };
btnReveal.onclick = reveler;

document.addEventListener("keydown", function(e){
  if (document.body.classList.contains("mode-liste")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { aller(index + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { aller(index - 1); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveler(); }
});

/* ---- Mode liste ---- */
var listeMode = document.getElementById("liste-mode");
var btnListe = document.getElementById("btn-liste");
var listeConstruite = false;

function construireListe(){
  if (listeConstruite) return;
  var h = '<h1 class="doc">Comportements en salle</h1>';
  h += '<p class="doc">Version complète, les ' + TOTAL + " écrans avec les réponses.</p>";
  for (var i = 0; i < SCREENS.length; i++){
    var s = SCREENS[i];
    h += '<div class="ecran' + (s.v ? " " + s.v : "") + '">' + corps(s, true, i + 1) + "</div>";
  }
  listeMode.innerHTML = h;
  listeConstruite = true;
}

btnListe.onclick = function(){
  var actif = document.body.classList.toggle("mode-liste");
  if (actif){
    construireListe();
    listeMode.classList.add("on");
    btnListe.classList.add("actif");
    btnListe.textContent = "Mode diaporama";
    compteur.textContent = TOTAL + " écrans";
    window.scrollTo(0, 0);
  } else {
    listeMode.classList.remove("on");
    btnListe.classList.remove("actif");
    btnListe.textContent = "Mode liste";
    afficher();
  }
};

/* ---- Copier ---- */
function copierTexte(texte, cible){
  var ok = function(){
    if (cible) {
      cible.textContent = "Copié";
      setTimeout(function(){ cible.textContent = ""; }, 2000);
    }
  };
  var repli = function(){
    try {
      var ta = document.createElement("textarea");
      ta.value = texte;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      ok();
    } catch (err2) {
      if (cible) cible.textContent = "Copie impossible";
    }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texte).then(ok, repli);
    } else {
      repli();
    }
  } catch (err) {
    repli();
  }
}

document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("[data-copy]") : null;
  if (!b) return;
  var id = b.getAttribute("data-copy");
  var racine = b.closest(".ecran") || document;
  var source = racine.querySelector("#" + id) || racine.querySelector(".phrase") || document.getElementById(id);
  var cible = racine.querySelector("#ok-" + id) || b.parentNode.querySelector(".copie-ok");
  if (source) copierTexte(source.textContent.trim(), cible);
});

afficher();
</script>
</body>
</html>
