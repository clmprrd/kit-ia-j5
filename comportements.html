<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comportements en salle</title>
<style>
  :root{
    --magenta:#E91FCB;
    --noir:#1A1A1A;
    --blanc:#FFFFFF;
    --gris:#4A4A4A;
    --rose:#FCE4F7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:Arial, Helvetica, sans-serif;
    background:var(--blanc);
    color:var(--noir);
    -webkit-font-smoothing:antialiased;
  }

  /* ===== BARRE HAUTE ===== */
  .bar{
    position:fixed;top:0;left:0;right:0;height:64px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;background:var(--blanc);
    border-bottom:3px solid var(--magenta);z-index:50;
  }
  .bar .titre{font-size:17px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase;color:var(--gris)}
  .bar .droite{display:flex;align-items:center;gap:18px}
  .compteur{font-size:26px;font-weight:bold;color:var(--magenta);white-space:nowrap}
  .btn{
    font-family:Arial, Helvetica, sans-serif;font-size:15px;font-weight:bold;
    padding:10px 18px;border:3px solid var(--noir);background:var(--blanc);color:var(--noir);
    cursor:pointer;border-radius:0;
  }
  .btn:hover{background:var(--rose)}
  .btn.actif{background:var(--magenta);border-color:var(--magenta);color:var(--blanc)}
  .progress{position:fixed;top:61px;left:0;height:6px;background:var(--magenta);z-index:51;transition:width .2s}

  /* ===== SCENE ===== */
  .scene{
    position:fixed;top:64px;left:0;right:0;bottom:88px;
    overflow-y:auto;
  }
  .ecran{
    min-height:100%;
    display:flex;flex-direction:column;justify-content:center;
    padding:44px 6vw 44px 6vw;
  }
  .ecran.pale{background:var(--rose)}
  .ecran.dark{background:var(--noir);color:var(--blanc)}
  .ecran.dark .kicker{color:var(--magenta)}
  .ecran.dark .sous{color:#E8E8E8}
  .ecran.dark .bloc{background:#2A2A2A;border-color:var(--magenta)}
  .ecran.dark .petit{color:#BBBBBB}

  .kicker{
    font-size:clamp(18px,1.9vw,30px);font-weight:bold;letter-spacing:3px;
    text-transform:uppercase;color:var(--magenta);margin-bottom:22px;
  }
  .grand{
    font-size:clamp(30px,4.4vw,66px);line-height:1.12;font-weight:bold;
    letter-spacing:-.5px;max-width:28ch;
  }
  .grand.long{font-size:clamp(26px,3.2vw,48px);max-width:26ch}
  .citation{
    font-size:clamp(30px,4.6vw,68px);line-height:1.14;font-weight:bold;
    max-width:26ch;color:var(--noir);
  }
  .sous{
    font-size:clamp(19px,1.9vw,30px);line-height:1.5;color:var(--gris);
    margin-top:26px;max-width:64ch;
  }
  .consigne{
    margin-top:34px;font-size:clamp(18px,2vw,31px);font-weight:bold;
    color:var(--magenta);text-transform:uppercase;letter-spacing:1.5px;
  }
  .petit{margin-top:26px;font-size:clamp(13px,1vw,16px);color:var(--gris);line-height:1.5;max-width:60ch}

  /* ===== REVELATION ===== */
  /* Quand la réponse est révélée, le titre s'efface au profit du contenu */
  .ecran.revele .citation,.ecran.revele .grand{font-size:clamp(24px,2.5vw,40px);max-width:40ch}
  .ecran.revele .sous{font-size:clamp(15px,1.35vw,21px);margin-top:14px;max-width:80ch}
  .ecran.revele .kicker{margin-bottom:12px;font-size:clamp(15px,1.4vw,22px)}
  .ecran.revele .consigne{display:none}
  .reveal{display:none;margin-top:34px;border-top:5px solid var(--magenta);padding-top:28px}
  .reveal.on{display:block}
  .reveal p{font-size:clamp(16px,1.5vw,23px);line-height:1.5;max-width:62ch;margin-bottom:14px}
  .reveal p:last-child{margin-bottom:0}
  .reveal p strong{color:var(--magenta)}
  .ecran.dark .reveal p{color:var(--blanc)}

  /* ===== LES QUATRE BLOCS ===== */
  .rv-bloc{margin-bottom:22px;max-width:74ch}
  .rv-bloc:last-child{margin-bottom:0}
  .rv-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 40px;align-items:start;margin-top:6px}
  .rv-grid .rv-bloc{margin-bottom:0;max-width:none}
  .rv-grid .rv-bloc p{max-width:none}
  .rv-grid .rv-src{grid-column:1 / -1}
  @media (max-width:1150px){.rv-grid{grid-template-columns:1fr}}
  .rv-h{
    font-size:clamp(13px,1.05vw,17px);font-weight:bold;letter-spacing:2.5px;
    text-transform:uppercase;color:var(--magenta);margin-bottom:10px;
  }
  .rv-pourquoi{background:var(--rose);border-left:12px solid var(--magenta);padding:24px 28px}
  .rv-pourquoi .rv-h{color:var(--noir)}
  .rv-pourquoi p{max-width:58ch}
  .rv-cas{border:3px solid var(--noir);padding:20px 26px}
  .rv-nf{border:3px dashed var(--magenta);padding:18px 26px}
  .rv-src{font-size:clamp(12px,.95vw,16px);color:var(--gris);line-height:1.5;word-break:break-word}
  .rv-src a{color:var(--magenta);font-weight:bold}
  .ecran.dark .rv-pourquoi{background:#2A2A2A}
  .ecran.dark .rv-pourquoi .rv-h{color:var(--magenta)}
  .ecran.dark .rv-cas{border-color:var(--magenta)}
  .ecran.dark .rv-src{color:#BBBBBB}

  .badge{
    display:inline-block;font-size:clamp(18px,2vw,30px);font-weight:bold;
    padding:8px 22px;background:var(--magenta);color:var(--blanc);
    letter-spacing:3px;margin-bottom:20px;
  }
  .badge.valeur{background:var(--noir)}

  .duo{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
  .col{flex:1 1 320px;padding:24px;border:4px solid var(--magenta);background:var(--blanc)}
  .col.contre{background:var(--noir);color:var(--blanc);border-color:var(--noir)}
  .col h4{font-size:clamp(15px,1.4vw,22px);text-transform:uppercase;letter-spacing:2px;color:var(--magenta);margin-bottom:14px}
  .col.contre h4{color:var(--blanc)}
  .col p{font-size:clamp(16px,1.45vw,22px);line-height:1.45;margin:0}

  .bloc{background:var(--rose);border-left:10px solid var(--magenta);padding:26px 28px;margin-top:8px}
  .bloc p{margin:0}

  .liste{list-style:none;margin-top:10px}
  .liste li{
    font-size:clamp(16px,1.5vw,24px);line-height:1.45;padding:14px 0 14px 30px;
    border-bottom:2px solid var(--rose);position:relative;
  }
  .liste li:before{content:"";position:absolute;left:0;top:24px;width:14px;height:14px;background:var(--magenta)}
  .liste li b{color:var(--magenta)}
  .ecran.dark .liste li{border-bottom-color:#3A3A3A}

  .phrase{
    font-size:clamp(19px,2vw,31px);line-height:1.4;font-weight:bold;
    font-style:normal;max-width:56ch;
  }
  .copier{margin-top:18px}
  .copier .btn{border-color:var(--magenta);color:var(--magenta)}
  .copier .btn:hover{background:var(--magenta);color:var(--blanc)}
  .copie-ok{margin-left:12px;font-size:15px;font-weight:bold;color:var(--magenta)}

  /* ===== BARRE BASSE ===== */
  .nav{
    position:fixed;bottom:0;left:0;right:0;height:88px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 28px;background:var(--blanc);border-top:3px solid var(--noir);z-index:50;
  }
  .fleche{
    font-family:Arial, Helvetica, sans-serif;font-size:30px;font-weight:bold;
    width:74px;height:56px;border:3px solid var(--noir);background:var(--blanc);
    color:var(--noir);cursor:pointer;line-height:1;
  }
  .fleche:hover{background:var(--rose)}
  .fleche:disabled{opacity:.25;cursor:default}
  .btn-methode{
    font-family:Arial, Helvetica, sans-serif;font-size:clamp(18px,1.9vw,30px);font-weight:bold;
    padding:16px 34px;background:var(--magenta);color:var(--blanc);border:none;cursor:pointer;
    letter-spacing:1px;
  }
  .btn-methode:hover{background:var(--noir)}
  .btn-methode.vide{visibility:hidden}

  /* ===== MODE LISTE ===== */
  .liste-mode{display:none;padding:100px 6vw 80px 6vw}
  .liste-mode.on{display:block}
  body.mode-liste .scene,body.mode-liste .nav,body.mode-liste .progress{display:none}
  .liste-mode .ecran{
    min-height:0;display:block;padding:40px 34px;margin-bottom:22px;
    border:3px solid var(--noir);
  }
  .liste-mode .reveal{display:block}
  .liste-mode .num{font-size:14px;font-weight:bold;color:var(--gris);letter-spacing:2px;margin-bottom:10px}
  .liste-mode .grand,.liste-mode .citation{font-size:clamp(24px,2.6vw,38px);max-width:100%}
  .liste-mode .sous,.liste-mode .reveal p,.liste-mode .rv-bloc{max-width:100%}
  .liste-mode h1.doc{font-size:38px;margin-bottom:8px;color:var(--magenta)}
  .liste-mode p.doc{font-size:18px;color:var(--gris);margin-bottom:34px}

  @media print{
    .bar,.nav,.progress{display:none}
    .scene{position:static;display:block}
    .ecran{page-break-after:always;min-height:auto}
    .reveal{display:block}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="titre">Comportements en salle</div>
  <div class="droite">
    <div class="compteur" id="compteur">1 sur 30</div>
    <button class="btn" id="btn-liste">Mode liste</button>
  </div>
</div>
<div class="progress" id="progress" style="width:0"></div>

<div class="scene" id="scene"></div>

<div class="nav">
  <button class="fleche" id="prec">&#8592;</button>
  <button class="btn-methode" id="btn-reveal">Ce que dit la méthode</button>
  <button class="fleche" id="suiv">&#8594;</button>
</div>

<div class="liste-mode" id="liste-mode"></div>

<script>
var SCREENS = [];

/* ---------- Fabrique des quatre blocs révélés ---------- */
function lien(u, t){
  return '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>';
}

function meth(o){
  var h = "";
  if (o.avant) h += o.avant;
  h += '<div class="rv-grid">';
  if (o.conduite){
    h += '<div class="rv-bloc"><div class="rv-h">La conduite à tenir</div><p>' + o.conduite + '</p></div>';
  }
  if (o.pourquoi){
    h += '<div class="rv-bloc rv-pourquoi"><div class="rv-h">Pourquoi ça marche</div><p>' + o.pourquoi + '</p></div>';
  }
  if (o.cas){
    h += '<div class="rv-bloc rv-cas"><div class="rv-h">' + (o.casTitre || "Le cas réel") + '</div><p>' + o.cas + '</p></div>';
  }
  if (o.nf){
    h += '<div class="rv-bloc rv-nf"><div class="rv-h">Ce qui n\'est pas établi</div><p>' + o.nf + '</p></div>';
  }
  if (o.src){
    h += '<div class="rv-bloc rv-src">Source : ' + o.src + '</div>';
  }
  h += '</div>';
  if (o.apres) h += o.apres;
  return h;
}

function obj(n, texte, nature, o){
  o.avant = '<span class="badge' + (nature === "VALEUR" ? " valeur" : "") + '">' + nature + '</span>';
  return {
    v: "",
    kicker: "Objection " + n + " sur 10",
    citation: "« " + texte + " »",
    consigne: "FAIT ou VALEUR ? Puis quelle réponse ?",
    reveal: meth(o)
  };
}

function profil(n, nom, manif, o){
  return {
    v: "",
    kicker: "Profil " + n + " sur 5",
    grand: "Le profil : " + nom,
    sous: manif,
    consigne: "Qu'est-ce que vous faites, vous ?",
    reveal: meth(o),
    petit: "La typologie des cinq profils vient des guides de formation de formateurs, Cegos et formationdeformateurs.fr. Ce sont des repères de terrain commodes pour trier, pas une typologie clinique validée par la recherche : personne n'est un profil, et une même personne change de comportement selon la séquence."
  };
}

function situ(n, titre, o){
  return {
    v: "",
    kicker: "Situation " + n + " sur 8",
    grand: titre,
    consigne: "Qu'est-ce qui se passe si vous ne faites rien ?",
    reveal: meth(o)
  };
}

/* ---------- 1. Ouverture ---------- */
SCREENS.push({
  v: "",
  kicker: "La règle à retenir",
  grand: "Ne jamais engager la discussion en premier avec l'opposant.",
  sous: "Faites parler le promoteur du groupe en premier. C'est le groupe qui convainc, ce n'est pas le formateur qui convainc seul contre un opposant, face à toute la salle.",
  consigne: "Pourquoi est-ce que ça marche, à votre avis ?",
  reveal: meth({
    conduite: "Quand l'objection tombe, ne répondez pas. Balayez la salle et cherchez qui a déjà dit quelque chose de favorable, qui hoche la tête, ou qui a raconté un usage. Donnez-lui la parole sur le point contesté : « vous, vous en avez fait quoi de ce point précis ? ». Vous vous placez en distributeur de parole, pas en avocat de l'outil. Vous ne reprenez la main qu'après, en vous appuyant sur ce que le groupe vient de dire, jamais sur votre seule autorité. Si personne ne se manifeste, ne forcez pas : passez par deux minutes en binôme sur la question, vous ressortirez avec un porte-parole plutôt qu'avec un duel.",
    pourquoi: "Le principe s'appuie sur le <strong>leader d'opinion</strong>, formalisé par Paul Lazarsfeld et Elihu Katz à l'école de Columbia dans les années cinquante. Leur observation est que l'influence ne va pas d'un émetteur unique vers chaque individu, mais transite par des relais : quelques personnes que le groupe écoute filtrent et retransmettent. Convaincre le relais convainc le groupe plus sûrement que convaincre chacun. Everett Rogers, avec la <strong>diffusion de l'innovation</strong>, décrit le même mécanisme dans le temps : une idée nouvelle se propage par cercles successifs, des adopteurs précoces vers la majorité, et ce sont ces premiers cercles qui font basculer les suivants. Le promoteur de votre salle est un adopteur précoce, et il vous coûte moins cher que vous.",
    nf: "Ces deux modèles décrivent la diffusion d'idées dans des populations, pas la gestion d'une objection dans une salle de formation de quinze personnes. Le transfert est cohérent et largement pratiqué, mais aucune étude ne mesure ce geste précis en formation professionnelle. C'est un principe transposé, pas un résultat expérimental."
  })
});

/* ---------- 2 et 3. La distinction la plus importante ---------- */
SCREENS.push({
  v: "pale",
  kicker: "La distinction la plus importante, 1 sur 2",
  grand: "Objection de FAIT",
  sous: "« ça ne marche pas », « ça hallucine », « ça va me faire perdre mon poste ». La personne conteste une performance ou une conséquence mesurable.",
  consigne: "Qu'est-ce qu'on oppose à une objection de fait ?",
  reveal: meth({
    conduite: "Traitez par la preuve, et par la preuve manipulée par la personne elle-même. Reformulez l'objection en un test vérifiable dans la salle : « si je vous montre que sur votre tâche de rédaction de compte rendu ça tient, on est d'accord que le point est réglé ? ». Puis faites le test sur son poste réel, pas sur un exemple de démonstration. Acceptez publiquement de perdre le test si le résultat est mauvais : c'est ce qui rend votre preuve recevable quand elle est bonne. Donnez des chiffres seulement s'ils sont vérifiables devant elle, jamais des ordres de grandeur invérifiables.",
    pourquoi: "Une objection de fait porte sur un état du monde observable, donc une preuve y est admissible. Mais une preuve administrée par quelqu'un qui a intérêt à convaincre se lit comme un plaidoyer, pas comme une preuve. C'est pourquoi le geste utile n'est pas de montrer, c'est de faire manipuler : la personne qui produit elle-même le résultat n'a plus à arbitrer entre sa perception et la vôtre. Le test annoncé à l'avance, avec un critère de réussite accepté par les deux, transforme un rapport de force en protocole.",
    nf: "L'idée qu'une démonstration manipulée par le participant convainc mieux qu'une démonstration regardée est un principe pédagogique de bon sens, largement partagé dans les guides de formation. Aucune étude n'isole spécifiquement ce geste face à une objection en salle. C'est du savoir-faire de terrain, présentez-le comme tel."
  })
});

SCREENS.push({
  v: "dark",
  kicker: "La distinction la plus importante, 2 sur 2",
  grand: "Objection de VALEUR",
  sous: "« l'IA est néfaste par principe », argument environnemental, argument politique. La personne ne conteste pas l'efficacité, elle conteste la légitimité ou la désirabilité même de l'outil.",
  consigne: "Et là, qu'est-ce qui change ?",
  reveal: meth({
    conduite: "Ne répondez surtout pas par la preuve d'efficacité : prouver que l'outil marche mieux ne répond à rien, puisque l'efficacité n'est pas ce qui est contesté. Faites trois choses, dans cet ordre. Nommez le désaccord à voix haute et sans ironie : « vous, ce n'est pas la performance qui vous pose problème, c'est le principe, et c'est un autre sujet ». Donnez les chiffres réels que vous avez, sans les esquiver ni les minimiser. Puis arrêtez-vous : proposez à la personne de rester et d'observer sans avoir à changer d'avis. Ne cherchez pas la conversion, cherchez la coexistence sur la demi-journée.",
    pourquoi: "La <strong>Moral Foundations Theory</strong> de Jonathan Haidt et Jesse Graham établit qu'une opposition de nature morale résiste à l'argumentation factuelle : on ne fait pas céder un jugement moral avec des chiffres, parce que le jugement moral ne s'est pas construit avec des chiffres. Insister produit l'effet inverse de celui recherché, la personne devant alors défendre son identité et plus seulement son opinion. Le principe du <strong>rolling with resistance</strong> de Miller et Rollnick, en entretien motivationnel, dit la même chose côté conduite : nommer le désaccord sans chercher à le résoudre fait tomber la réaction de défense, parce qu'il n'y a plus rien à repousser.",
    cas: "Le repère pratique en salle : une objection de valeur ne se termine jamais par un accord, elle se termine par une phrase du type « on n'est pas d'accord et ce n'est pas grave, on va travailler quand même ». Si vous cherchez l'accord, vous perdez le reste du groupe, qui regarde le duel au lieu de faire l'exercice.",
    casTitre: "Le repère de salle"
  })
});

/* ---------- 4 à 13. Dix objections ---------- */
SCREENS.push(obj(1, "Ça invente des choses, je ne peux pas m'y fier", "FAIT", {
  conduite: "Commencez par donner raison, sans réserve : oui, ça invente, et ce n'est pas résolu. Puis faites-le en direct, sur un sujet que la salle maîtrise mieux que l'outil, un règlement interne, une date locale, un nom propre du secteur. L'hallucination apparaît, tout le monde la voit, et elle cesse d'être une rumeur pour devenir un objet de travail. Enchaînez immédiatement sur le protocole : demander les sources, recouper systématiquement, ne jamais utiliser sans relecture sur un sujet à enjeu, et bannir l'outil des tâches où l'erreur ne se voit pas. Formulez la règle en une phrase que la personne pourra répéter à son équipe.",
  pourquoi: "La personne a raison sur le fait, et contester un fait vrai détruit la crédibilité pour tout le reste de la session. Le geste consiste à déplacer la question : on ne discute plus de « est-ce que ça invente », qui est tranché, mais de « qu'est-ce qu'on met en place pour que ça ne coûte rien ». Vous passez d'un débat que vous perdez à un problème d'organisation que vous savez traiter. Nommer soi-même la limite avant que le groupe ne la trouve renforce la crédibilité perçue, alors que la minimiser la détruit dès la première contradiction.",
  cas: "IBM Watson for Oncology. Des documents internes révélés en juillet 2018 montrent que des recommandations de traitement étaient qualifiées en interne de dangereuses et incorrectes. La cause identifiée n'était pas la puissance du système mais son alimentation : il avait été entraîné sur des cas synthétiques construits par une poignée de médecins, pas sur des données patients réelles. C'est l'argument utile en salle : la fiabilité dépend de ce qu'on donne à l'outil et du contrôle qu'on garde, pas de sa réputation.",
  src: lien("https://www.statnews.com/2018/07/25/ibm-watson-recommended-unsafe-incorrect-treatments/", "STAT News, 25 juillet 2018, IBM Watson recommended unsafe and incorrect treatments")
}));

SCREENS.push(obj(2, "Ça va supprimer mon poste", "FAIT", {
  conduite: "Ne rassurez pas. Une promesse de non-remplacement faite par un formateur extérieur n'est pas vérifiable, donc elle ne vaut rien, et le groupe le sait. Faites autre chose : demandez à la personne de lister à voix haute cinq tâches de sa semaine, puis triez ensemble ce qui est automatisable aujourd'hui, ce qui ne l'est pas, et ce qui deviendra un travail de contrôle. Nommez ce qui est réellement exposé, sans l'adoucir. Terminez sur la seule chose que vous maîtrisez : ce que la personne peut faire de sa journée d'aujourd'hui pour être du côté de celui qui pilote l'outil.",
  pourquoi: "L'inquiétude d'être remplacé est une objection de fait sur un futur, donc invérifiable dans les deux sens : ni vous ni la personne ne pouvez la trancher. Ce qui est vérifiable, en revanche, c'est le découpage de son poste en tâches, et c'est le seul terrain où la conversation peut avancer. Le geste consiste à ramener une peur globale et indécidable à un inventaire concret et discutable. Reconnaître au passage que l'inquiétude est majoritaire dans la population active retire à la personne la charge d'avoir à se justifier devant le groupe.",
  cas: "Pew Research Center, enquête d'octobre 2024 publiée en février 2025 auprès de 5273 actifs américains : 52 pourcent se disent inquiets de l'usage futur de l'IA au travail, et 32 pourcent anticipent moins d'opportunités pour eux à long terme. La phrase à dire en salle : « vous êtes dans la majorité, pas dans la marge, et on ne va pas faire comme si la question ne se posait pas ».",
  src: lien("https://www.pewresearch.org/social-trends/2025/02/25/u-s-workers-are-more-worried-than-hopeful-about-future-ai-use-in-the-workplace/", "Pew Research Center, 25 février 2025")
}));

SCREENS.push(obj(3, "L'IA consomme trop d'énergie, c'est une aberration écologique", "VALEUR", {
  conduite: "Reconnaissez le désaccord, donnez les chiffres à jour, dites ce qu'on ne sait pas, et arrêtez-vous là. Concrètement : « l'impact est réel, il est mesuré, et voilà les seuls chiffres solides dont je dispose ». Donnez la mesure publiée par Google en août 2025 sur son propre assistant, puis l'ordre de grandeur des centres de données par l'Agence internationale de l'énergie. Précisez que le premier chiffre est une mesure d'entreprise sur son propre parc, pas une moyenne du secteur. Ne comparez avec rien : pas de voiture, pas de machine à laver, pas de fabrication de téléphone, ces comparaisons circulent partout sans source primaire traçable et un formateur expérimenté vous le fera remarquer.",
  pourquoi: "C'est une objection de valeur, donc elle ne se traite pas par la preuve d'efficacité, et l'insistance déclenche la défense identitaire décrite par Haidt. Mais elle a une particularité utile : sur ce sujet précis, la plupart des chiffres qui circulent sont faux ou périmés. Votre crédibilité ne se gagne pas en défendant l'outil, elle se gagne en corrigeant les chiffres dans les deux sens, y compris ceux qui vous arrangeraient. C'est ce qui vous distingue d'un vendeur aux yeux de la personne qui objecte.",
  cas: "Le chiffre des « 6 à 10 fois plus d'électricité qu'une recherche web » est périmé et contesté par les analystes qui l'avaient produit, surévalué d'un facteur proche de dix. La mesure publiée par Google en août 2025 sur son propre assistant donne, pour une requête texte médiane, 0,24 Wh, 0,03 g de CO2 équivalent et 0,26 mL d'eau, avec une énergie par requête divisée par 33 et des émissions divisées par 44 entre mai 2024 et mai 2025.",
  src: lien("https://cloud.google.com/blog/products/infrastructure/measuring-the-environmental-impact-of-ai-inference", "Google Cloud, août 2025, mesure de l'impact environnemental de l'inférence") + " et " + lien("https://www.iea.org/reports/energy-and-ai", "Agence internationale de l'énergie, Energy and AI")
}));

SCREENS.push(obj(4, "Je ne veux pas être remplacé par une machine, c'est une question de principe", "VALEUR", {
  conduite: "Reconnaissez la position sans la réfuter, et surtout n'argumentez pas sur l'efficacité, qui n'est pas le sujet. Dites-le explicitement : « ce que vous dites, ce n'est pas que ça marche mal, c'est que vous ne voulez pas, et c'est votre droit ». Proposez ensuite un cadre de coexistence pour la journée : la personne participe aux exercices en observatrice, elle n'a rien à valider, et elle garde le droit de dire à la fin que ça ne lui convient toujours pas. Ce contrat explicite est ce qui vous évite de la retrouver en embuscade sur chaque séquence.",
  pourquoi: "C'est le principe du <strong>rolling with resistance</strong> de Miller et Rollnick : la résistance n'est pas un trait de la personne, c'est un produit de la relation. Elle monte quand quelqu'un pousse, elle tombe quand personne ne pousse. Nommer le désaccord sans chercher à le résoudre supprime l'objet contre lequel la personne s'arc-boutait. En pratique, une position de principe assumée publiquement se durcit à chaque tentative de conversion, parce que la personne défend alors sa cohérence devant témoins, ce qui coûte bien plus cher que défendre une opinion.",
  cas: "Pew Research Center, février 2025, sur 5273 actifs : 32 pourcent anticipent moins d'opportunités pour eux à long terme. Autrement dit, la position de principe est rarement isolée dans une salle, elle est souvent la formulation assumée de ce que plusieurs autres pensent sans le dire. C'est pour cela que la façon dont vous la traitez est regardée par tout le groupe.",
  src: lien("https://www.pewresearch.org/social-trends/2025/02/25/u-s-workers-are-more-worried-than-hopeful-about-future-ai-use-in-the-workplace/", "Pew Research Center, 25 février 2025")
}));

SCREENS.push(obj(5, "Ça a déjà été essayé chez nous, ça n'a pas marché", "FAIT", {
  conduite: "Ne contredisez pas, enquêtez. Posez quatre questions dans l'ordre : qu'est-ce qui a été tenté exactement, quand, sur quelle tâche précise, et qui accompagnait. Dans la grande majorité des cas, la réponse fait apparaître un outil imposé sans cas d'usage, une consigne floue, ou l'absence totale d'accompagnement. Reprenez alors le cas raté en direct, devant tout le monde, et laissez le groupe constater l'écart. Si le cas ne s'améliore pas, dites-le : « celui-là, effectivement, ce n'est pas pour ça ». Vous gagnez plus à valider un échec réel qu'à sauver la face.",
  pourquoi: "Un échec collectif fait autorité dans une salle, parce que tout le monde s'en souvient et que personne ne veut passer pour naïf. Le contredire sans le détail revient à nier l'expérience partagée du groupe, et vous perdez la salle en une phrase. Le détail, lui, déplace la conversation du verdict vers le diagnostic : on ne discute plus de « est-ce que ça marche », on discute de « qu'est-ce qui a manqué la dernière fois », ce qui est un terrain où le groupe a des choses à dire et où vous êtes utile.",
  cas: "Rapport MIT NANDA relayé par MIT Sloan, été 2025 : 95 pourcent des pilotes d'IA générative en entreprise ne produisent aucun impact mesurable, alors que 90 pourcent des salariés utilisent déjà des outils personnels en parallèle. La cause identifiée est l'intégration et l'absence d'apprentissage du contexte de l'entreprise, pas le rejet par les utilisateurs. C'est l'argument exact à donner : leur échec est le cas général, et il ne dit rien de l'outil, il dit tout du dispositif.",
  src: lien("https://sloanreview.mit.edu/projects/the-emerging-agentic-enterprise-how-leaders-must-navigate-a-new-age-of-ai/", "MIT Sloan Management Review, The Emerging Agentic Enterprise")
}));

SCREENS.push(obj(6, "C'est une mode, ça va passer", "FAIT", {
  conduite: "Ne répondez jamais par l'enthousiasme, c'est exactement ce que la personne teste. Donnez deux choses dans la même minute : des usages en production dans des entreprises comparables à son secteur, et un recul documenté, une entreprise qui est allée trop loin et qui a reculé. Puis rendez la question au groupe : « qu'est-ce qui, chez vous, tiendrait encore dans trois ans, et qu'est-ce qui est clairement un effet de vague ? ». Vous obtenez un tri fait par eux, bien plus solide que votre pronostic.",
  pourquoi: "Cette objection n'est pas une question sur la technologie, c'est un test sur vous : la personne cherche à savoir si elle a en face d'elle un formateur ou un vendeur. Citer spontanément un échec retentissant est le geste qui tranche, parce qu'un vendeur ne le fait pas. Vous perdez un argument et vous gagnez la crédibilité qui rend recevables tous les suivants.",
  cas: "Klarna, mai 2025. Après avoir annoncé qu'un agent IA remplaçait l'équivalent de 700 postes au service client, le dirigeant a reconnu être allé trop loin, la qualité ayant baissé, et l'entreprise a recommencé à recruter. Le point à souligner : la cause n'était pas l'IA, c'était un remplacement total sans escalade humaine sur les cas complexes. Ce n'est donc ni la preuve que c'est une mode, ni la preuve que tout marche, et c'est ce qui en fait un bon cas à donner.",
  nf: "L'idée que citer un échec renforce la crédibilité de la source est un principe classique de psychologie sociale de la persuasion, mais je n'ai pas d'étude qui l'isole dans le contexte d'une formation professionnelle. Traitez-le comme un savoir-faire de terrain."
  ,
  src: lien("https://www.forbes.com/sites/quickerbettertech/2025/05/18/business-tech-news-klarna-reverses-on-ai-says-customers-like-talking-to-people/", "Forbes, 18 mai 2025, Klarna reverses on AI")
}));

SCREENS.push(obj(7, "Ça va déshumaniser la relation client", "VALEUR", {
  conduite: "Reconnaissez l'inquiétude et ne la balayez surtout pas par des statistiques de satisfaction, qui donnent l'impression que vous n'avez pas entendu. Posez une question qui rend la valeur opérationnelle : « où est la limite, pour vous, entre ce qu'une machine peut traiter et ce qui doit rester humain ? ». Faites tracer cette ligne par le groupe, notez-la au tableau, et montrez ensuite comment on la tient techniquement, par une règle d'escalade vers un humain. Vous n'avez pas converti la personne, vous avez transformé son objection en spécification.",
  pourquoi: "Sur le fond, c'est une objection de valeur : elle ne se traite pas par la preuve, et le principe de Miller et Rollnick s'applique, on ne pousse pas. Mais celle-ci a un correlat opérationnel, contrairement à une objection purement morale : la ligne entre automatisable et humain est un objet de travail réel. Le geste consiste à respecter la valeur et à en tirer une contrainte de conception, ce qui donne à la personne un rôle utile dans la salle au lieu d'un rôle d'opposante.",
  cas: "Klarna, mai 2025, est le cas exact de cette objection : l'entreprise a remplacé son service client par un agent, la qualité a baissé, le dirigeant l'a reconnu publiquement et le recrutement a repris. La cause identifiée n'est pas l'automatisation en soi mais l'absence d'escalade humaine sur les cas complexes. La personne qui objecte a donc raison sur le risque, et la réponse n'est pas de le nier, c'est de nommer le garde-fou.",
  src: lien("https://www.forbes.com/sites/quickerbettertech/2025/05/18/business-tech-news-klarna-reverses-on-ai-says-customers-like-talking-to-people/", "Forbes, 18 mai 2025, Klarna reverses on AI")
}));

SCREENS.push(obj(8, "Je n'ai pas le temps d'apprendre un nouvel outil", "FAIT", {
  conduite: "Ne promettez aucun gain général, ce sont des promesses de brochure et elles se retournent. Prenez une tâche réelle de son poste, chronométrez-la telle qu'elle la fait aujourd'hui, refaites-la avec l'outil, et donnez l'écart en minutes réelles devant tout le monde, y compris si l'écart est faible. Puis faites-lui refaire l'opération seule, sans support et sans regarder l'écran d'à côté. Dix minutes de pratique avec rappel valent plus qu'une heure de démonstration regardée, et c'est cette pratique-là que vous devez lui vendre, pas l'outil.",
  pourquoi: "C'est l'<strong>effet de test</strong> de Roediger et Karpicke, 2006 : le rappel actif, se forcer à restituer sans support, bat la relecture à deux jours et à une semaine. Or l'argument du temps repose sur une intuition inverse, celle qu'il faudrait d'abord tout lire et tout regarder avant de pouvoir faire. En montrant qu'on apprend en faisant et en se trompant, vous réduisez le coût annoncé de l'apprentissage, qui est le vrai objet de l'objection. Corollaire pratique : ne distribuez pas le mémo avant l'exercice, distribuez-le après.",
  nf: "Attention en salle si un formateur expérimenté creuse : l'effet de test est solidement établi sur des apprentissages de contenu, listes, textes, faits. Son transfert à l'apprentissage d'un geste outil en formation professionnelle est une extrapolation raisonnable, mais aucune étude dédiée ne l'isole. Dites-le, cela vous coûte moins cher que de vous faire reprendre."
}));

SCREENS.push(obj(9, "Les grandes entreprises technologiques accumulent trop de pouvoir avec l'IA", "VALEUR", {
  conduite: "Reconnaissez que c'est un enjeu politique légitime, et ne répondez pas par des arguments de performance produit, qui feraient de vous le porte-parole des entreprises visées. Distinguez ensuite deux plans à voix haute : ce qui se joue au niveau politique et réglementaire, sur lequel ni vous ni la salle n'avez la main aujourd'hui, et ce qui se décide dans leur organisation, le choix des outils, le lieu d'hébergement des données, l'existence d'alternatives ouvertes, la dépendance acceptée ou non à un fournisseur unique. Traitez le second, laissez le premier ouvert sans prétendre le régler.",
  pourquoi: "Une objection politique est une objection de valeur : l'argumentation factuelle sur les mérites du produit ne l'atteint pas, et Haidt explique pourquoi, le jugement ne s'est pas construit sur ces critères. Le geste utile est le découpage entre ce sur quoi la personne n'a pas prise et ce sur quoi elle en a, parce qu'il transforme un sentiment d'impuissance, qui produit du retrait, en une liste de décisions concrètes, qui produit de l'engagement. Vous ne changez pas l'opinion, vous rendez la journée utile malgré l'opinion.",
  nf: "Le découpage entre ce qui est sous contrôle et ce qui ne l'est pas est un geste de conduite du changement courant, cohérent avec le besoin d'autonomie décrit par Deci et Ryan, mais aucune étude ne mesure son effet sur une objection politique en formation. Savoir-faire de terrain."
}));

SCREENS.push(obj(10, "Mes données, mes documents internes, où vont-ils vraiment ?", "FAIT", {
  conduite: "C'est un fait, donc une réponse factuelle et vérifiable, jamais une réassurance. Ouvrez les paramètres devant la salle, montrez où se règle la réutilisation des contenus, distinguez les offres grand public des offres professionnelles, et dites clairement ce que vous ne savez pas plutôt que de combler. Renvoyez ensuite à la seule autorité qui compte pour eux : la politique interne de leur organisation et la personne qui en répond. Terminez par une règle simple et mémorisable sur ce qui ne se colle jamais dans un outil grand public.",
  pourquoi: "Sur ce sujet, l'esquive est le seul geste qui transforme mécaniquement une objection de fait en objection de valeur : la personne qui sent qu'on lui cache quelque chose cesse de discuter des données et se met à discuter de la légitimité de l'outil, terrain sur lequel plus rien n'est prouvable. Nommer soi-même un risque réel, avec ses limites, maintient la conversation sur le terrain factuel où vous pouvez être utile. La règle courte et répétable compte plus que l'exhaustivité : ce qui n'est pas mémorisable ne sera pas appliqué lundi.",
  nf: "Il n'existe pas de règle unique valable pour tous les outils et toutes les offres, et les conditions changent vite. Ce que vous montrez en salle est vrai le jour où vous le montrez : dites-le, et refusez de répondre à la place du service juridique de leur entreprise."
}));

/* ---------- 15 à 19. Cinq profils ---------- */
SCREENS.push(profil(1, "le bavard", "Monopolise la parole, digresse, reprend la main après chaque question posée au groupe.", {
  conduite: "Reformulez son propos en une phrase, remerciez, puis rendez la question au groupe et taisez-vous. Comptez mentalement jusqu'à cinq avant de reprendre la parole, sans combler le vide. Si le vide vous met mal à l'aise, regardez ailleurs que lui : le contact visuel est une invitation à parler. En cas de récidive, cadrez sans le viser, pour tout le monde : « on fait un tour où chacun dit une phrase, une seule, et on commence par la droite ». Jamais de remarque publique sur son temps de parole.",
  pourquoi: "Le bavard occupe souvent un vide que le formateur a créé lui-même. <strong>Mary Budd Rowe</strong>, en 1986, a mesuré que les enseignants attendent moins d'une seconde après une question avant de reprendre la parole ou de désigner quelqu'un. Porter ce temps d'attente à trois ou cinq secondes augmente la longueur des réponses, la confiance dans ce qui est dit, et fait entrer dans la conversation des personnes qui ne parlaient jamais. Autrement dit, la meilleure façon de réduire la part de parole du bavard n'est pas de le couper, c'est d'attendre plus longtemps que lui.",
  cas: "Le geste concret, mesurable pour vous dès la prochaine session : après votre question, comptez cinq secondes dans votre tête avant tout autre son. C'est très long à tenir la première fois, et c'est précisément ce qui rend l'effet visible.",
  casTitre: "Le geste, chiffré",
  nf: "Couper sèchement en public produit l'effet inverse, la personne double sa prise de parole suivante : c'est une observation de terrain constante dans les guides de formation de formateurs, pas un résultat expérimental chiffré.",
  src: lien("https://journals.sagepub.com/doi/10.1177/002248718603700110", "Mary Budd Rowe, 1986, Wait Time, Journal of Teacher Education")
}));

SCREENS.push(profil(2, "le contradicteur", "Objecte systématiquement, teste le formateur, cherche la faille plus que la réponse.", {
  conduite: "Laissez le groupe répondre avant vous, systématiquement. Puis reformulez son objection mieux qu'il ne l'a formulée, jusqu'à ce qu'il dise « oui, c'est ça », avant de dire quoi que ce soit d'autre. Ne cherchez pas à gagner l'échange : donnez-lui raison sur la part qui est juste, et bornez le désacord au reste. Si vous devez trancher, tranchez sur le fond et pas sur la personne, et proposez-lui de vérifier le point pendant la pause, ce qui sort le duel de la scène.",
  pourquoi: "La reformulation vient de l'écoute active de <strong>Carl Rogers</strong> et des reflets de l'entretien motivationnel de <strong>Miller et Rollnick</strong> : une personne qui vient d'être reformulée fidèlement n'a plus à répéter, donc n'a plus à monter le ton. La charge défensive tombe parce que l'objection est déjà portée par quelqu'un d'autre. Le principe de <strong>rolling with resistance</strong> complète : la résistance se nourrit de ce qui la pousse. Un contradicteur privé de contradicteur en face de lui perd très vite son rôle.",
  cas: "Le repère de salle : quand vous laissez le groupe répondre le premier, le contradicteur ne se bat plus contre le formateur mais contre ses collègues, ce qui est un rapport de force qu'il ne cherche pas et qui le fait redescendre de lui-même.",
  casTitre: "Le repère de salle",
  nf: "L'attribution de la contradiction systématique à une position hiérarchique menacée ou à un besoin de contrôle est une hypothèse de terrain répandue, pas un résultat de recherche. Elle aide à ne pas le prendre personnellement, elle ne prouve rien."
}));

SCREENS.push(profil(3, "l'expert auto-proclamé", "Prend la place du formateur, apporte des cas particuliers hors sujet, complète chaque réponse.", {
  conduite: "Nommez son expertise à voix haute, tôt, et devant tout le monde : « vous, vous avez pratiqué, donc sur ce point je vais m'appuyer sur vous ». Puis confiez-lui un rôle précis et borné, et seulement celui-là : il valide un exemple, il traite les questions techniques d'un exercice, il co-anime cinq minutes sur un point qu'il maîtrise. Le rôle doit avoir une fin annoncée. Ce que vous achetez, c'est la reconnaissance publique, et elle coûte trois secondes.",
  pourquoi: "C'est le mécanisme des <strong>affirmations</strong> en entretien motivationnel, chez Miller et Rollnick : reconnaître explicitement une compétence réelle diminue la résistance, parce que la personne n'a plus besoin de défendre son statut avant de pouvoir discuter du fond. Tant que le statut n'est pas reconnu, chaque prise de parole sert d'abord à l'établir, et le contenu passe après. Une fois reconnu, la même personne devient souvent le meilleur relais du groupe, au sens du leader d'opinion de l'écran d'ouverture.",
  cas: "L'erreur symétrique, et la plus coûteuse : l'ignorer ou minimiser sa contribution. Il ne se tait pas, il cherche des alliés dans la salle, et vous vous retrouvez à animer contre un sous-groupe au lieu d'un individu.",
  casTitre: "Ce qui aggrave",
  nf: "L'idée que ce comportement viendrait de la peur de paraître dépassé n'a aucune donnée chiffrée derrière elle, seulement une observation répétée sur le terrain. Le geste, lui, s'appuie sur un principe documenté ; l'explication psychologique de la cause, non."
}));

SCREENS.push(profil(4, "le discret", "Silence, aucune contribution spontanée, participe aux exercices sans jamais prendre la parole en plénière.", {
  conduite: "Ne le désignez pas en plénière. Trois gestes, dans cet ordre : allongez votre temps d'attente après chaque question posée au groupe, jusqu'à cinq secondes, ce qui suffit souvent ; faites passer les questions par le binôme ou le trio avant la plénière ; sollicitez-le en aparté pendant un exercice, où le coût social d'une réponse est nul. Si vous voulez sa contribution devant tout le monde, demandez-lui d'abord en privé s'il accepte que vous la repreniez, puis attribuez-la lui publiquement.",
  pourquoi: "<strong>Mary Budd Rowe</strong>, 1986 : quand le temps d'attente après une question passe sous la seconde à trois ou cinq secondes, ce sont précisément les élèves habituellement silencieux qui commencent à répondre, et la longueur des réponses augmente. Le silence d'une personne discrète n'est donc pas toujours un trait de caractère, c'est souvent une conséquence directe du rythme imposé par l'animateur. Vous avez la main sur ce rythme, vous n'avez pas la main sur son tempérament : travaillez sur ce que vous contrôlez.",
  cas: "Le forcer en public produit une humiliation puis un retrait définitif pour le reste de la journée, et le groupe enregistre que prendre la parole est risqué. Le coût ne porte pas sur une personne, il porte sur toute la salle.",
  casTitre: "Ce qui aggrave",
  nf: "La recommandation classique de commencer par une question fermée plutôt qu'ouverte avec une personne discrète ne repose sur aucune étude qui l'isole. C'est un usage de terrain plausible, présentez-le comme tel si on vous demande la source.",
  src: lien("https://journals.sagepub.com/doi/10.1177/002248718603700110", "Mary Budd Rowe, 1986, Wait Time, Journal of Teacher Education")
}));

SCREENS.push(profil(5, "le démotivé", "Présence physique sans engagement, formation manifestement subie, décidée par la hiérarchie sans lui.", {
  conduite: "Faites nommer ce qui a manqué, sans défendre le commanditaire : « qu'est-ce qu'on ne vous a pas demandé avant de vous inscrire ? ». Écoutez la réponse en entier. Puis repartez de son terrain à lui : demandez un cas concret de sa semaine, et faites la séquence suivante sur ce cas-là plutôt que sur votre exemple. Donnez-lui un retour précis sur ce qu'il produit, pas un encouragement général. Ne cherchez pas l'adhésion à la formation, cherchez un résultat utilisable dans son travail de la semaine prochaine.",
  pourquoi: "C'est le cœur de l'<strong>andragogie</strong> de Malcolm Knowles, 1980 : un adulte s'engage quand le contenu résout un problème qu'il reconnaît comme le sien, et quand il a eu part à la décision d'apprendre. Ici la décision lui a été retirée, et c'est ce manque-là qu'il exprime, pas un rejet du sujet. Repartir d'un cas qu'il apporte lui restitue la seule part de décision encore disponible, celle du contenu. Le retour, lui, doit répondre aux trois questions de <strong>Hattie et Timperley</strong> : où je vais, où j'en suis, quelle est la prochaine étape.",
  cas: "Faire comme si de rien n'était est le pire choix : le silence collectif valide son désengagement, et son voisin en déduit que le retrait est une option acceptable pour la journée.",
  casTitre: "Ce qui aggrave"
}));

  if (s.kicker) h += '<div class="kicker">' + s.kicker + "</div>";
  if (s.citation) h += '<div class="citation">' + s.citation + "</div>";
  if (s.grand) h += '<div class="grand' + (s.grand.length > 42 ? " long" : "") + '">' + s.grand + "</div>";
  if (s.sous) h += '<div class="sous">' + s.sous + "</div>";
  if (s.consigne) h += '<div class="consigne">' + s.consigne + "</div>";
  h += '<div class="reveal">' + s.reveal + "</div>";
  if (s.petit) h += '<div class="petit">' + s.petit + "</div>";
  return h;
}

function afficher(){
  var s = SCREENS[index];
  var d = document.createElement("div");
  d.className = "ecran" + (s.v ? " " + s.v : "");
  d.innerHTML = corps(s, false, 0);
  scene.innerHTML = "";
  scene.appendChild(d);
  scene.scrollTop = 0;
  compteur.textContent = (index + 1) + " sur " + TOTAL;
  progress.style.width = ((index + 1) / TOTAL * 100) + "%";
  document.getElementById("prec").disabled = (index === 0);
  document.getElementById("suiv").disabled = (index === TOTAL - 1);
  btnReveal.classList.remove("vide");
  btnReveal.textContent = "Ce que dit la méthode";
}

function reveler(){
  var r = scene.querySelector(".reveal");
  if (!r) return;
  r.classList.add("on");
  var e = scene.querySelector(".ecran");
  if (e) e.classList.add("revele");
  btnReveal.classList.add("vide");
}

function aller(n){
  if (n < 0 || n >= TOTAL) return;
  index = n;
  afficher();
}

document.getElementById("prec").onclick = function(){ aller(index - 1); };
document.getElementById("suiv").onclick = function(){ aller(index + 1); };
btnReveal.onclick = reveler;

document.addEventListener("keydown", function(e){
  if (document.body.classList.contains("mode-liste")) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { aller(index + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { aller(index - 1); }
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); reveler(); }
});

/* ---- Mode liste ---- */
var listeMode = document.getElementById("liste-mode");
var btnListe = document.getElementById("btn-liste");
var listeConstruite = false;

function construireListe(){
  if (listeConstruite) return;
  var h = '<h1 class="doc">Comportements en salle</h1>';
  h += '<p class="doc">Version complète, les ' + TOTAL + " écrans avec les réponses, les mécanismes et les sources.</p>";
  for (var i = 0; i < SCREENS.length; i++){
    var s = SCREENS[i];
    h += '<div class="ecran' + (s.v ? " " + s.v : "") + '">' + corps(s, true, i + 1) + "</div>";
  }
  listeMode.innerHTML = h;
  listeConstruite = true;
}

btnListe.onclick = function(){
  var actif = document.body.classList.toggle("mode-liste");
  if (actif){
    construireListe();
    listeMode.classList.add("on");
    btnListe.classList.add("actif");
    btnListe.textContent = "Mode diaporama";
    compteur.textContent = TOTAL + " écrans";
    window.scrollTo(0, 0);
  } else {
    listeMode.classList.remove("on");
    btnListe.classList.remove("actif");
    btnListe.textContent = "Mode liste";
    afficher();
  }
};

/* ---- Copier ---- */
function copierTexte(texte, cible){
  var ok = function(){
    if (cible) {
      cible.textContent = "Copié";
      setTimeout(function(){ cible.textContent = ""; }, 2000);
    }
  };
  var repli = function(){
    try {
      var ta = document.createElement("textarea");
      ta.value = texte;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      ok();
    } catch (err2) {
      if (cible) cible.textContent = "Copie impossible";
    }
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(texte).then(ok, repli);
    } else {
      repli();
    }
  } catch (err) {
    repli();
  }
}

document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest("[data-copy]") : null;
  if (!b) return;
  var id = b.getAttribute("data-copy");
  var racine = b.closest(".ecran") || document;
  var source = racine.querySelector("#" + id) || racine.querySelector(".phrase") || document.getElementById(id);
  var cible = racine.querySelector("#ok-" + id) || b.parentNode.querySelector(".copie-ok");
  if (source) copierTexte(source.textContent.trim(), cible);
});

afficher();
</script>
