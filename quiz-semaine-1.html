<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Semaine 1 · Référent IA</title>
<style>
:root{
  --magenta:#E91FCB;
  --noir:#1A1A1A;
  --blanc:#FFFFFF;
  --gris:#4A4A4A;
  --rose:#FCE4F7;
  --vert:#1F7A4D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--blanc);
  color:var(--noir);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1280px;margin:0 auto;padding:18px 28px 60px}

header{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  border-bottom:4px solid var(--magenta);
  padding-bottom:14px;margin-bottom:26px;
}
.marque{font-size:20px;font-weight:bold;color:var(--magenta);letter-spacing:.5px}
.marque span{color:var(--gris);font-weight:normal}
.spacer{flex:1}
.score{
  font-size:26px;font-weight:bold;color:var(--noir);
  background:var(--rose);border:2px solid var(--magenta);
  padding:6px 18px;border-radius:6px;white-space:nowrap;
}
.score small{font-size:14px;color:var(--gris);font-weight:normal}
button{font-family:Arial,Helvetica,sans-serif;cursor:pointer}
.btn{
  background:var(--blanc);color:var(--noir);
  border:2px solid var(--gris);
  padding:10px 20px;font-size:16px;border-radius:6px;font-weight:bold;
}
.btn:hover{border-color:var(--magenta);color:var(--magenta)}
.btn-plein{background:var(--magenta);color:var(--blanc);border-color:var(--magenta)}
.btn-plein:hover{background:var(--noir);border-color:var(--noir);color:var(--blanc)}
.btn:disabled{opacity:.3;cursor:default}
.btn:disabled:hover{border-color:var(--gris);color:var(--noir)}

.meta{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.num{font-size:22px;font-weight:bold;color:var(--magenta)}
.jour{
  font-size:16px;font-weight:bold;color:var(--gris);
  border-left:3px solid var(--magenta);padding-left:12px;
}
.piege{
  background:var(--magenta);color:var(--blanc);
  font-size:15px;font-weight:bold;letter-spacing:2px;
  padding:4px 14px;border-radius:4px;
}

.question{
  font-size:38px;line-height:1.28;font-weight:bold;
  color:var(--noir);margin:0 0 30px;max-width:1150px;
}

.options{display:flex;flex-direction:column;gap:14px;max-width:1150px}
.opt{
  display:flex;align-items:flex-start;gap:16px;width:100%;text-align:left;
  background:var(--blanc);border:3px solid var(--gris);
  border-radius:8px;padding:18px 22px;font-size:24px;line-height:1.35;
  color:var(--noir);
}
.opt:hover{border-color:var(--magenta)}
.opt .lettre{
  flex:0 0 auto;font-weight:bold;color:var(--magenta);
  border:2px solid var(--magenta);border-radius:5px;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.repondu .opt{cursor:default}
.repondu .opt:hover{border-color:var(--gris)}
.opt.juste{background:var(--vert);border-color:var(--vert);color:var(--blanc)}
.opt.juste .lettre{border-color:var(--blanc);color:var(--blanc)}
.opt.juste:hover{border-color:var(--vert)}
.opt.faux{background:#F0F0F0;border-color:#C8C8C8;color:var(--gris)}
.opt.faux .lettre{border-color:var(--gris);color:var(--gris)}
.opt.faux:hover{border-color:#C8C8C8}
.opt.choisi-faux{border-color:var(--noir);border-width:4px}

.expl{
  margin-top:26px;max-width:1150px;
  background:var(--rose);border-left:10px solid var(--magenta);
  border-radius:6px;padding:22px 26px;
}
.expl h3{font-size:19px;color:var(--magenta);margin-bottom:10px;letter-spacing:1px}
.expl p{font-size:20px;line-height:1.5;margin-bottom:14px}
.expl .lbl{font-weight:bold;color:var(--noir)}
.expl ul{list-style:none;margin:0 0 14px}
.expl li{font-size:19px;line-height:1.45;margin-bottom:9px;padding-left:26px;position:relative}
.expl li:before{content:"";position:absolute;left:0;top:9px;width:14px;height:3px;background:var(--magenta)}
.src{font-size:14px;color:var(--gris);font-style:italic;border-top:1px solid #E0C0DA;padding-top:10px}

.nav{display:flex;gap:14px;align-items:center;margin-top:34px;flex-wrap:wrap}
.progress{flex:1;min-width:180px;height:8px;background:#EEE;border-radius:4px;overflow:hidden}
.progress div{height:100%;background:var(--magenta);width:0}

.final h1{font-size:44px;color:var(--magenta);margin-bottom:10px}
.gros{font-size:96px;font-weight:bold;color:var(--noir);line-height:1}
.gros small{font-size:32px;color:var(--gris)}
.parjour{display:flex;gap:16px;flex-wrap:wrap;margin:26px 0}
.carte{background:var(--rose);border:2px solid var(--magenta);border-radius:8px;padding:16px 24px;min-width:190px}
.carte b{display:block;font-size:15px;color:var(--gris);letter-spacing:1px;margin-bottom:6px}
.carte span{font-size:34px;font-weight:bold;color:var(--noir)}
.rate{border-left:8px solid var(--magenta);padding:16px 22px;margin-bottom:20px;background:#FAFAFA;border-radius:0 6px 6px 0;max-width:1150px}
.rate h4{font-size:22px;margin-bottom:10px}
.rate .bonne{font-size:19px;color:var(--vert);font-weight:bold;margin-bottom:10px}

.anim .bloc{border-bottom:2px solid #EEE;padding:26px 0;max-width:1150px}
.anim .q{font-size:24px;font-weight:bold;margin:8px 0 12px}
.anim .o{font-size:18px;margin:5px 0;padding-left:20px}
.anim .o.ok{color:var(--vert);font-weight:bold}
.anim .titre-jour{
  font-size:28px;color:var(--magenta);font-weight:bold;
  border-bottom:3px solid var(--magenta);padding:24px 0 10px;margin-bottom:6px;
}
.masque{display:none}
@media print{.nav,header .btn,.progress{display:none}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="marque">Quiz Semaine 1 <span>· Référent IA · Lyon</span></div>
  <div class="spacer"></div>
  <div class="score" id="score">0 <small>/ 30</small></div>
  <button class="btn" id="btnAnim" type="button">Mode animateur</button>
  <button class="btn" id="btnReset" type="button">Recommencer</button>
</header>

<main id="ecranQuiz">
  <div class="meta">
    <div class="num" id="num">Question 1 sur 30</div>
    <div class="jour" id="jour"></div>
    <div class="piege masque" id="badgePiege">PIÈGE</div>
  </div>
  <h2 class="question" id="question"></h2>
  <div class="options" id="options"></div>
  <div class="expl masque" id="expl"></div>
  <div class="nav">
    <button class="btn" id="btnPrec" type="button">Précédent</button>
    <button class="btn btn-plein" id="btnSuiv" type="button">Suivant</button>
    <div class="progress"><div id="barre"></div></div>
  </div>
</main>

<main id="ecranFinal" class="final masque"></main>
<main id="ecranAnim" class="anim masque"></main>

</div>

<script>
var QUESTIONS = [

/* ================= JOUR 1 ================= */
{
 jour:"Jour 1",
 piege:false,
 q:"Par quel mécanisme un grand modèle de langage produit-il sa réponse ?",
 opts:[
  "Il comprend le sens des mots grâce à une modélisation sémantique profonde.",
  "Il prédit, étape après étape, le token suivant le plus probable.",
  "Il va chercher une phrase toute faite dans une base de connaissances encyclopédique.",
  "Il applique une modélisation logique du monde réel avant de rédiger."
 ],
 bonne:1,
 pourquoi:"Un LLM est entraîné sur des quantités massives de texte pour prédire la suite la plus probable d'une séquence. La réponse émerge token par token, en tenant compte de tout ce qui précède, sans qu'aucune compréhension véritable n'intervienne.",
 pieges:[
  "La compréhension sémantique profonde est exactement ce que le modèle ne fait pas. Le support le dit sans détour : il ne comprend pas ce qu'il raconte.",
  "Le modèle ne cherche pas une phrase toute faite dans une base : il génère sa réponse au fur et à mesure, mot après mot.",
  "Aucune modélisation logique du monde réel n'intervient. Ce sont des régularités statistiques tirées des textes lus pendant l'entraînement."
 ],
 src:"Jour 1, matinée, séquence Comprendre les LLM"
},
{
 jour:"Jour 1",
 piege:true,
 q:"Un collaborateur écrit un prompt de 100 mots. Peut-il en conclure qu'il consomme 100 tokens ?",
 opts:[
  "Oui, un token correspond à un mot, c'est la définition.",
  "Non, il en consomme forcément moins, le modèle compresse les mots courants.",
  "Non : un token peut être un mot, une syllabe ou un seul caractère, et un mot accentué ou un nom propre en vaut souvent plusieurs.",
  "La question n'a pas de sens, les tokens ne concernent que la réponse du modèle, pas le prompt."
 ],
 bonne:2,
 pourquoi:"Avant de prédire quoi que ce soit, le modèle découpe le texte en tokens. Un mot courant vaut environ 1 token, un mot accentué 2 à 3 tokens, un nom propre ou technique 3 à 4 tokens. Un texte français accentué consomme donc davantage de tokens que son nombre de mots.",
 pieges:[
  "C'est le raccourci le plus répandu, et il est faux : le support insiste sur le fait qu'un LLM ne lit pas vraiment des mots.",
  "Le découpage ne compresse rien, il fragmente. Le compte va vers le haut, pas vers le bas, dès qu'il y a des accents ou des noms propres.",
  "La tokenisation s'applique à l'entrée comme à la sortie. Le prompt est découpé avant tout traitement."
 ],
 src:"Jour 1, matinée, séquence Tokenisation, démonstration sur le tokenizer OpenAI"
},
{
 jour:"Jour 1",
 piege:true,
 q:"Une collègue dit : je corrige l'IA quand elle se trompe, comme ça elle apprend et ne refera pas l'erreur. A-t-elle raison ?",
 opts:[
  "Oui, chaque conversation nourrit l'entraînement du modèle.",
  "Non, parce que le modèle est incapable de reconnaître qu'il s'est trompé.",
  "Oui, mais seulement si l'on active la mémoire entre conversations.",
  "Non : quand on discute avec l'outil on est en phase d'inférence, le modèle applique ce qu'il a déjà appris et ne réapprend pas."
 ],
 bonne:3,
 pourquoi:"Le support sépare nettement deux phases. L'entraînement est long, extrêmement coûteux en énergie, réalisé en amont une fois pour toutes. L'inférence est le moment où vous écrivez un prompt et où le modèle prépare sa réponse. Corriger le modèle en conversation n'écrit rien dans le modèle.",
 pieges:[
  "C'est la confusion que la séquence entraînement contre inférence sert précisément à lever. L'image du support : le cuisinier qui a appris pendant des années, opposé au même cuisinier qui prépare votre plat au moment où vous le commandez.",
  "Le modèle peut parfaitement reconnaître une erreur dans l'échange en cours. Le problème n'est pas là : c'est que cette correction ne survit pas à un entraînement déjà figé.",
  "La mémoire entre conversations conserve du contexte pour vous, elle ne modifie pas le modèle lui-même. Ce sont deux choses différentes."
 ],
 src:"Jour 1, matinée, séquence Entraînement et inférence"
},
{
 jour:"Jour 1",
 piege:false,
 q:"Que désigne le biais de confirmation dans l'usage d'une IA générative ?",
 opts:[
  "L'IA confirme systématiquement la véracité des informations qu'elle produit.",
  "L'IA est conçue pour confirmer les préjugés de ses développeurs.",
  "La tendance à privilégier les informations qui valident ce que l'on pense déjà, l'IA devenant un miroir de nos certitudes.",
  "L'IA confirme la conformité légale des actions qu'elle recommande."
 ],
 bonne:2,
 pourquoi:"La démonstration du support le montre en direct : une question neutre puis une question orientée sur le même sujet produisent deux argumentaires convaincants et opposés. L'IA amplifie la direction qu'on lui donne, donc elle confirme ce que la question suppose déjà.",
 pieges:[
  "L'IA ne vérifie rien avant de générer. Un LLM prédit le token le plus probable, pas le plus exact.",
  "Le biais de confirmation est un biais de l'utilisateur, pas une intention des concepteurs. À ne pas confondre avec les biais présents dans les données d'entraînement, qui sont un autre sujet.",
  "Rien dans le fonctionnement d'un LLM ne vérifie la légalité d'une action."
 ],
 src:"Jour 1, matinée, séquence Biais algorithmiques, démonstration de la question orientée"
},
{
 jour:"Jour 1",
 piege:false,
 q:"Quelle est la parade la plus efficace et la plus immédiatement applicable contre les hallucinations ?",
 opts:[
  "Fournir le document source, et autoriser explicitement le « je ne sais pas ».",
  "Reformuler la question jusqu'à obtenir deux fois la même réponse.",
  "Utiliser uniquement les outils les plus récents du marché.",
  "Demander au modèle de deviner quand l'information lui manque."
 ],
 bonne:0,
 pourquoi:"Le support classe cette parade comme la plus efficace et la plus simple à appliquer tout de suite : on donne le document, l'extrait, les chiffres réels, et on ajoute au prompt que si l'information n'y figure pas, le modèle doit le dire plutôt que deviner. Sans cette instruction, il comble les lacunes sans prévenir.",
 pieges:[
  "Deux réponses identiques ne prouvent rien : le modèle peut se tromper deux fois de la même façon, avec la même assurance.",
  "La nouveauté d'un outil ne supprime pas le mécanisme d'hallucination, qui tient à la prédiction elle-même.",
  "C'est l'inverse exact du réflexe à acquérir. Autoriser la devinette, c'est fabriquer l'hallucination."
 ],
 src:"Jour 1, matinée, séquence Hallucinations, les 3 réflexes"
},
{
 jour:"Jour 1",
 piege:true,
 q:"Une direction annonce : nos requêtes IA sont neutres en carbone grâce à nos achats de compensation, donc notre usage est sans impact. Que répond le référent IA ?",
 opts:[
  "C'est exact, le CO2 est le seul indicateur qui compte pour un usage numérique.",
  "Le CO2 n'est qu'un indicateur parmi d'autres : restent l'eau de refroidissement, les matières premières, la fabrication des équipements et les déchets électroniques.",
  "C'est exact pour l'inférence, mais pas pour l'entraînement du modèle.",
  "L'impact est négligeable dès lors que les data centers sont situés en France."
 ],
 bonne:1,
 pourquoi:"Le support décompose l'impact en quatre étages : matières premières, fabrication des équipements et des data centers, utilisation avec électricité et refroidissement, puis renouvellement du matériel et déchets électroniques. La phrase à retenir est que le CO2 n'est qu'un indicateur parmi d'autres, et que la vraie question n'est pas « est-ce que l'IA peut le faire » mais « est-ce que son usage est pertinent ici ».",
 pieges:[
  "Réduire l'impact au seul CO2 est précisément l'erreur que la séquence sur l'impact environnemental sert à corriger.",
  "La distinction entraînement contre inférence est réelle, et l'entraînement est extrêmement coûteux, mais l'inférence consomme elle aussi des ressources. Elle ne dédouane pas l'usage courant.",
  "Un mix électrique moins carboné réduit les émissions liées à l'électricité, il ne touche ni au refroidissement en eau, ni aux métaux, ni aux déchets."
 ],
 src:"Jour 1, matinée, séquences Impact environnemental et Technolucidité"
},
{
 jour:"Jour 1",
 piege:true,
 q:"Un dirigeant demande : notre outil de tri de candidatures est classé haut risque par l'AI Act, faut-il l'arrêter ?",
 opts:[
  "Oui, haut risque signifie usage interdit dans l'Union européenne.",
  "La question ne se pose pas : l'AI Act classe des outils, pas des usages, et aucun outil du marché n'est classé haut risque.",
  "Non, l'AI Act ne concerne que les fournisseurs, jamais les entreprises utilisatrices.",
  "Non : haut risque n'est pas une interdiction, l'usage reste autorisé avec des obligations renforcées de gouvernance, de documentation et de supervision humaine."
 ],
 bonne:3,
 pourquoi:"L'AI Act repose sur un principe de proportionnalité : plus un usage présente de risques, plus il est encadré. Un système haut risque n'est pas interdit, il doit respecter des obligations renforcées : gestion des risques documentée, gouvernance des données, documentation et traçabilité, supervision humaine effective, robustesse et cybersécurité.",
 pieges:[
  "L'interdiction est une catégorie distincte et beaucoup plus étroite, avec par exemple la reconnaissance des émotions au travail. Le tri de candidatures est cité comme exemple de haut risque, pas d'usage interdit.",
  "C'est l'inverse : l'AI Act qualifie un usage, pas simplement un outil. Le même outil peut relever de catégories différentes selon le contexte de déploiement.",
  "L'entreprise qui utilise le système est déployeur, et le déployeur est responsable de l'usage qu'il en fait. Le fournisseur, lui, répond de la conformité du système."
 ],
 src:"Jour 1, après-midi, AI Act, catégories de risque et rôles fournisseur et déployeur"
},
{
 jour:"Jour 1",
 piege:true,
 q:"Un projet a été validé par le juriste au titre du RGPD. Peut-on considérer que la conformité IA est traitée ?",
 opts:[
  "Oui, le RGPD est le texte le plus exigeant, il absorbe les obligations de l'AI Act.",
  "Non, mais seulement si le projet traite des données de santé.",
  "Non : les deux textes répondent à des questions différentes et peuvent s'appliquer en même temps à une même situation.",
  "Oui, l'AI Act ne s'applique qu'aux fournisseurs de modèles, jamais aux projets internes."
 ],
 bonne:2,
 pourquoi:"L'AI Act demande quel risque présente cet usage de l'IA. Le RGPD demande ce que l'on fait des données personnelles : finalité, base légale, minimisation, droits des personnes. Le support prend l'exemple d'une IA de présélection de candidats, qui relève de l'AI Act pour l'usage RH et du RGPD pour les données des candidats, en même temps.",
 pieges:[
  "Aucun des deux textes n'absorbe l'autre. Ils ne posent tout simplement pas la même question.",
  "Le cumul ne dépend pas de la nature sensible des données. Il vaut dès qu'il y a à la fois un usage d'IA qualifiable et des données personnelles.",
  "Le déployeur, c'est-à-dire l'entreprise qui utilise le système dans son activité, est explicitement visé par l'AI Act."
 ],
 src:"Jour 1, après-midi, séquence RGPD n'est pas l'AI Act"
},
{
 jour:"Jour 1",
 piege:false,
 q:"Que prévoit l'article 4 de l'AI Act sur la maîtrise de l'IA ?",
 opts:[
  "Chaque salarié doit suivre une formation certifiante identique, quel que soit son poste.",
  "Fournisseurs et déployeurs doivent prendre des mesures concrètes pour développer la maîtrise de l'IA des personnes qui utilisent ces systèmes pour leur compte, adaptées au profil et au contexte.",
  "L'obligation ne pèse que sur le fournisseur du modèle.",
  "L'obligation n'est pas encore exigible, elle entrera en vigueur avec l'application intégrale du règlement."
 ],
 bonne:1,
 pourquoi:"L'article 4 impose aux fournisseurs comme aux déployeurs des mesures ajustées à quatre paramètres : le niveau de connaissance des personnes, le système utilisé, le contexte d'usage, et les personnes concernées par les décisions. Il est applicable depuis le 2 février 2025. Tout le monde n'a pas besoin du même niveau de maîtrise, mais chaque organisation doit pouvoir le justifier.",
 pieges:[
  "Le texte demande l'inverse d'un traitement uniforme : les mesures s'ajustent au profil. Le support oppose les équipes RH qui construisent un système de scoring à celles qui génèrent du contenu pour les réseaux sociaux.",
  "Le déployeur est visé au même titre que le fournisseur, c'est explicite dans l'article.",
  "L'article 4 est applicable depuis le 2 février 2025, date citée dans le support de la journée."
 ],
 src:"Jour 1, après-midi, AI Act article 4, applicable depuis le 2 février 2025"
},
{
 jour:"Jour 1",
 piege:true,
 q:"Un éditeur affirme : notre solution IA est hébergée en Europe. Peut-on en conclure qu'elle est souveraine ?",
 opts:[
  "Oui, l'hébergement en Europe est le critère qui définit la souveraineté.",
  "Oui, dès lors que l'éditeur communique une certification de sécurité.",
  "Non : il faut aussi savoir qui contrôle le service, à quelles juridictions il est soumis, quels tiers interviennent et quelles garanties contractuelles existent.",
  "Non, seule une solution installée sur les serveurs de l'entreprise peut être qualifiée de souveraine."
 ],
 bonne:2,
 pourquoi:"La souveraineté est un faisceau de critères, pas un lieu. La grille du support pose quatre questions : qui contrôle l'outil, où les données sont stockées et traitées, qui d'autre intervient, et quelles garanties existent. Une filiale européenne d'un groupe américain reste soumise à la loi américaine, et le CLOUD Act permet aux autorités d'accéder aux données détenues par des entreprises américaines, même en Europe.",
 pieges:[
  "Le support écrit noir sur blanc qu'un hébergement en Europe ne suffit pas, à lui seul, à rendre une solution souveraine. Il ajoute que « entreprise européenne », « données hébergées en Europe » et « toutes les données restent en Europe » sont trois affirmations différentes.",
  "Une certification répond à la question des garanties, qui n'est qu'une des quatre. À noter : SecNumCloud est une qualification de sécurité délivrée par l'ANSSI à des offres cloud précises, alors que Gaia-X n'est pas un hébergeur mais une initiative de règles communes.",
  "L'on-premise offre le contrôle maximal, mais la souveraineté se lit sur les quatre questions de la grille, pas sur ce seul mode de déploiement. Le lieu de traitement peut d'ailleurs différer du lieu de stockage."
 ],
 src:"Jour 1, après-midi, grille de souveraineté en 4 questions, repères CNIL et ANSSI SecNumCloud"
},

/* ================= JOUR 2 ================= */
{
 jour:"Jour 2",
 piege:false,
 q:"Quel est le principe d'un système RAG ?",
 opts:[
  "Remplacer le modèle de langage par une base de données interne.",
  "Accélérer la vitesse de génération des réponses du modèle.",
  "Entraîner un modèle de langage sur les données propriétaires de l'organisation.",
  "Rechercher des informations pertinentes dans une base documentaire, puis les transmettre au modèle comme contexte pour construire sa réponse."
 ],
 bonne:3,
 pourquoi:"RAG signifie Retrieval-Augmented Generation, en français génération augmentée par récupération d'informations. La chaîne est : question, recherche dans les documents, sélection des passages utiles, envoi au modèle, réponse. L'image du support : c'est comme donner un classeur à l'IA avant qu'elle réponde.",
 pieges:[
  "Le modèle n'est pas remplacé, il reste l'étage qui rédige. La base documentaire l'alimente, elle ne le supplante pas.",
  "Le RAG ajoute une étape de recherche avant la génération. Il n'a jamais été présenté comme un gain de vitesse.",
  "Le RAG n'entraîne pas le modèle, il lui fournit des informations au moment où il doit répondre."
 ],
 src:"Jour 2, après-midi, séquence RAG, principe et cas d'usage"
},
{

 src:"Jour 3, après-midi, atelier matrice, cas 3 collectivité, niveaux de sensibilité N1 à N4"
},
{
 jour:"Jour 3",
 piege:true,
 q:"Pendant la démonstration, le formateur coupe le réseau et le modèle local répond quand même. Qu'est-ce que cela prouve ?",
 opts:[
  "Que le dispositif est conforme au RGPD.",
  "Que le modèle local est de qualité équivalente à un modèle en ligne.",
  "Que l'installation passera à l'échelle pour un service de cinquante personnes.",
  "Uniquement que la donnée n'est pas sortie du poste."
 ],
 bonne:3,
 pourquoi:"La coupure du réseau est le cœur pédagogique de la démonstration : c'est le seul moment de la journée où la souveraineté cesse d'être une notion et devient une observation. Mais le support énumère explicitement ce que cette scène ne prouve pas, et la conformité en fait partie : elle prouve seulement que la donnée n'est pas sortie.",
 pieges:[
  "La conformité se démontre par des obligations tenues, pas par une prise réseau débranchée. L'hébergement interne ne dispense d'aucune obligation.",
  "Le formateur pose au contraire la même question à un modèle en ligne pour montrer que le modèle local est visiblement moins bon.",
  "Un poste de travail n'est pas un service partagé. Le passage à l'échelle est nommément exclu de ce que la démonstration établit."
 ],
 src:"Jour 3, après-midi, démonstration d'installation locale, étape 4 et « Ce que la démonstration ne prouve pas »"
}
];

/* ---------------- État ---------------- */
var CLE = "quiz-s1-lyon-11-09";
var etat = { i:0, reponses:[], fini:false };
for (var k=0;k<QUESTIONS.length;k++){ etat.reponses.push(null); }

function charger(){
  try{
    var brut = window.localStorage.getItem(CLE);
    if(!brut) return;
    var o = JSON.parse(brut);
    if(o && Object.prototype.toString.call(o.reponses)==="[object Array]" && o.reponses.length===QUESTIONS.length){
      etat.reponses = o.reponses;
      etat.i = (typeof o.i === "number" && o.i>=0 && o.i<QUESTIONS.length) ? o.i : 0;
      etat.fini = !!o.fini;
    }
  }catch(e){ /* stockage indisponible, on continue en memoire */ }
}
function sauver(){
  try{ window.localStorage.setItem(CLE, JSON.stringify(etat)); }catch(e){}
}
function effacer(){
  try{ window.localStorage.removeItem(CLE); }catch(e){}
}

function scoreTotal(){
  var n=0;
  for(var j=0;j<QUESTIONS.length;j++){
    if(etat.reponses[j]!==null && etat.reponses[j]===QUESTIONS[j].bonne) n++;
  }
  return n;
}
function scoreJour(nom){
  var bons=0, tot=0;
  for(var j=0;j<QUESTIONS.length;j++){
    if(QUESTIONS[j].jour!==nom) continue;
    tot++;
    if(etat.reponses[j]!==null && etat.reponses[j]===QUESTIONS[j].bonne) bons++;
  }
  return bons+" / "+tot;
}

var elQuiz=document.getElementById("ecranQuiz");
var elFinal=document.getElementById("ecranFinal");
var elAnim=document.getElementById("ecranAnim");
var elNum=document.getElementById("num");
var elJour=document.getElementById("jour");
var elBadge=document.getElementById("badgePiege");
var elQ=document.getElementById("question");
var elOpts=document.getElementById("options");
var elExpl=document.getElementById("expl");
var elScore=document.getElementById("score");
var elBarre=document.getElementById("barre");
var btnPrec=document.getElementById("btnPrec");
var btnSuiv=document.getElementById("btnSuiv");
var LETTRES=["A","B","C","D"];

function majScore(){
  elScore.innerHTML = scoreTotal()+" <small>/ "+QUESTIONS.length+"</small>";
}

function rendre(){
  majScore();
  elBarre.style.width = Math.round(((etat.i+1)/QUESTIONS.length)*100)+"%";
  var q = QUESTIONS[etat.i];
  var rep = etat.reponses[etat.i];

  elNum.textContent = "Question "+(etat.i+1)+" sur "+QUESTIONS.length;
  elJour.textContent = q.jour;
  elBadge.className = q.piege ? "piege" : "piege masque";
  elQ.textContent = q.q;

  elOpts.innerHTML = "";
  elOpts.className = rep===null ? "options" : "options repondu";

  for(var a=0;a<q.opts.length;a++){
    (function(idx){
      var b=document.createElement("button");
      b.type="button";
      b.className="opt";
      var sp=document.createElement("span");
      sp.className="lettre";
      sp.textContent=LETTRES[idx];
      var tx=document.createElement("span");
      tx.textContent=q.opts[idx];
      b.appendChild(sp); b.appendChild(tx);
      if(rep!==null){
        if(idx===q.bonne){ b.className="opt juste"; }
        else { b.className = (idx===rep) ? "opt faux choisi-faux" : "opt faux"; }
      } else {
        b.onclick=function(){
          etat.reponses[etat.i]=idx;
          sauver();
          rendre();
        };
      }
      elOpts.appendChild(b);
    })(a);
  }

  if(rep===null){
    elExpl.className="expl masque";
    elExpl.innerHTML="";
  } else {
    elExpl.className="expl";
    elExpl.innerHTML = blocExplication(q);
  }

  btnPrec.disabled = (etat.i===0);
  btnSuiv.textContent = (etat.i===QUESTIONS.length-1) ? "Voir le résultat" : "Suivant";
}

function blocExplication(q){
  var h = "<h3>POURQUOI CETTE RÉPONSE</h3>";
  h += "<p><span class=\"lbl\">Bonne réponse, "+LETTRES[q.bonne]+".</span> "+q.pourquoi+"</p>";
  h += "<h3>POURQUOI LES AUTRES SONT FAUSSES</h3><ul>";
  var n=0;
  for(var i=0;i<q.opts.length;i++){
    if(i===q.bonne) continue;
    h += "<li><span class=\"lbl\">"+LETTRES[i]+".</span> "+q.pieges[n]+"</li>";
    n++;
  }
  h += "</ul>";
  h += "<div class=\"src\">Source : "+q.src+"</div>";
  return h;
}

function afficherFinal(){
  var total=scoreTotal();
  var h = "<h1>Quiz Semaine 1, résultat</h1>";
  h += "<div class=\"gros\">"+total+" <small>/ "+QUESTIONS.length+"</small></div>";
  h += "<div class=\"parjour\">";
  h += "<div class=\"carte\"><b>JOUR 1</b><span>"+scoreJour("Jour 1")+"</span></div>";
  h += "<div class=\"carte\"><b>JOUR 2</b><span>"+scoreJour("Jour 2")+"</span></div>";
  h += "<div class=\"carte\"><b>JOUR 3</b><span>"+scoreJour("Jour 3")+"</span></div>";
  h += "</div>";

  var rates=[];
  for(var j=0;j<QUESTIONS.length;j++){
    if(etat.reponses[j]===null || etat.reponses[j]!==QUESTIONS[j].bonne) rates.push(j);
  }
  if(rates.length===0){
    h += "<p style=\"font-size:24px\">Aucune question ratée. Les trente réponses sont justes.</p>";
  } else {
    h += "<h2 style=\"font-size:28px;color:#E91FCB;margin:10px 0 18px\">À revoir : "+rates.length+" question(s)</h2>";
    for(var r=0;r<rates.length;r++){
      var idx=rates[r]; var q=QUESTIONS[idx];
      h += "<div class=\"rate\">";
      h += "<h4>Q"+(idx+1)+" · "+q.jour+(q.piege?" · PIÈGE":"")+" : "+q.q+"</h4>";
      h += "<div class=\"bonne\">Bonne réponse : "+LETTRES[q.bonne]+". "+q.opts[q.bonne]+"</div>";
      h += "<div class=\"expl\" style=\"margin-top:0\">"+blocExplication(q)+"</div>";
      h += "</div>";
    }
  }
  h += "<div class=\"nav\"><button class=\"btn btn-plein\" type=\"button\" onclick=\"retourQuiz()\">Revenir aux questions</button>";
  h += "<button class=\"btn\" type=\"button\" onclick=\"recommencer()\">Recommencer</button></div>";
  elFinal.innerHTML=h;
  elQuiz.className="masque";
  elAnim.className="anim masque";
  elFinal.className="final";
  majScore();
}

function afficherAnim(){
  var h = "<h1 style=\"font-size:38px;color:#E91FCB;margin-bottom:6px\">Mode animateur</h1>";
  h += "<p style=\"font-size:18px;color:#4A4A4A;margin-bottom:10px\">Les 30 questions, leur bonne réponse en vert et l'explication complète. Vue de relecture, aucune interaction.</p>";
  var jourCourant="";
  for(var j=0;j<QUESTIONS.length;j++){
    var q=QUESTIONS[j];
    if(q.jour!==jourCourant){
      jourCourant=q.jour;
      h += "<div class=\"titre-jour\">"+jourCourant+"</div>";
    }
    h += "<div class=\"bloc\">";
    h += "<div style=\"font-size:15px;color:#4A4A4A;letter-spacing:1px\">Q"+(j+1)+(q.piege?" · <b style=\"color:#E91FCB\">PIÈGE</b>":"")+"</div>";
    h += "<div class=\"q\">"+q.q+"</div>";
    for(var a=0;a<q.opts.length;a++){
      h += "<div class=\"o"+(a===q.bonne?" ok":"")+"\">"+LETTRES[a]+". "+q.opts[a]+"</div>";
    }
    h += "<div class=\"expl\" style=\"margin-top:14px\">"+blocExplication(q)+"</div>";
    h += "</div>";
  }
  h += "<div class=\"nav\"><button class=\"btn btn-plein\" type=\"button\" onclick=\"retourQuiz()\">Revenir au quiz</button></div>";
  elAnim.innerHTML=h;
  elQuiz.className="masque";
  elFinal.className="final masque";
  elAnim.className="anim";
  window.scrollTo(0,0);
}

function retourQuiz(){
  etat.fini=false; sauver();
  elFinal.className="final masque";
  elAnim.className="anim masque";
  elQuiz.className="";
  rendre();
  window.scrollTo(0,0);
}
function recommencer(){
  etat.i=0; etat.fini=false;
  etat.reponses=[];
  for(var k=0;k<QUESTIONS.length;k++){ etat.reponses.push(null); }
  effacer(); sauver();
  retourQuiz();
}

btnSuiv.onclick=function(){
  if(etat.i===QUESTIONS.length-1){ etat.fini=true; sauver(); afficherFinal(); return; }
  etat.i++; sauver(); rendre(); window.scrollTo(0,0);
};
btnPrec.onclick=function(){
  if(etat.i>0){ etat.i--; sauver(); rendre(); window.scrollTo(0,0); }
};
document.getElementById("btnAnim").onclick=function(){
  if(elAnim.className.indexOf("masque")===-1){ retourQuiz(); } else { afficherAnim(); }
};
document.getElementById("btnReset").onclick=function(){ recommencer(); };

document.onkeydown=function(e){
  if(elQuiz.className.indexOf("masque")!==-1) return;
  if(e.key==="ArrowRight"){ btnSuiv.onclick(); }
  if(e.key==="ArrowLeft"){ btnPrec.onclick(); }
};

charger();
if(etat.fini){ afficherFinal(); } else { rendre(); }
</script>
</body>
</html>
